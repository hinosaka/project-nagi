<!-- SCR-012 予算管理（月ごとの目標売上・日別目標売上の登録・確認） -->
<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <?!= include('client/shared/stylesheet') ?>
    <style>
      .toggle-tabs { display: inline-flex; background: var(--surface-2); border-radius: 999px; padding: 3px; margin-bottom: var(--space-md); }
      .toggle-tab { border: none; background: none; border-radius: 999px; padding: 7px 16px; font-weight: 700; font-size: 0.9em; color: var(--ink-muted); }
      .toggle-tab.active { background: var(--ai); color: #fff; }
      .tab-panel { display: none; }
      .tab-panel.active { display: block; }

      .toolbar-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: var(--space-md); flex-wrap: wrap; gap: var(--space-sm); }
      .year-row { display: flex; align-items: center; gap: 2px; }
      .year-label { font-weight: 700; font-size: 1.1em; padding: 4px 10px; }
      .edit-actions { display: flex; align-items: center; gap: var(--space-sm); }
      .edit-actions button { font-size: 0.9em; }
      .save-flash { color: var(--good); font-size: 0.8em; }

      .cell-input { width: 100%; border: 1px solid transparent; background: none; color: inherit; font: inherit; padding: 3px 4px; border-radius: var(--radius-sm); text-align: right; }
      .cell-input:hover { border-color: var(--border); }
      .cell-input:focus { border-color: var(--ai); outline: 2px solid var(--ai-soft); background: var(--surface); }
      .readonly-cell { padding: 3px 4px; }

      /* 列構成：1.月 2.売上目標 3.実績 4.達成率 5.メモ 6.日別へ（編集有無で行き来する
         input⇔読み取り専用表示の両方に同じ配置ルールが効くよう、列位置（nth-child）で指定する） */
      #budget-table { font-variant-numeric: tabular-nums; table-layout: fixed; font-size: 0.9em; }
      #budget-table tbody tr:nth-child(even) { background: none; }
      #budget-table th, #budget-table td { text-align: right; }
      #budget-table th:nth-child(1), #budget-table td:nth-child(1) { text-align: left; width: 4.5em; }
      #budget-table th:nth-child(5), #budget-table td:nth-child(5) { text-align: left; }
      #budget-table th:nth-child(5) .cell-input, #budget-table td:nth-child(5) .readonly-cell { text-align: left; }
      #budget-table th:nth-child(6), #budget-table td:nth-child(6) { text-align: right; width: 5.5em; }

      .cal-weekdays { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-bottom: 6px; }
      .cal-weekdays span { text-align: center; font-size: 0.78em; color: var(--ink-muted); font-weight: 700; }
      .cal-weekdays span:first-child { color: var(--bad); }
      .cal-weekdays span:last-child { color: var(--ai); }
      .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
      .cal-cell { aspect-ratio: 1 / 0.85; border-radius: var(--radius-sm); border: 1px solid var(--border); padding: 6px; display: flex; flex-direction: column; }
      .cal-cell.empty { border: none; background: none; }
      .cal-cell.sun { background: var(--bad-soft); }
      .cal-cell.sat { background: var(--ai-soft); }
      .cal-cell.holiday { background: var(--warn-soft); }
      .cal-day-num { font-size: 0.78em; color: var(--ink-muted); font-weight: 700; }
      .cal-amount { margin-top: auto; font-size: 0.82em; font-variant-numeric: tabular-nums; font-weight: 700; text-align: right; }
      .cal-amount.fallback { color: var(--ink-muted); font-weight: 400; font-style: italic; }
      .cal-cell input { width: 100%; border: 1px solid var(--border); border-radius: 4px; font: inherit; font-size: 0.78em; text-align: right; padding: 2px 3px; margin-top: auto; background: var(--surface); color: var(--ink); }

      .rate-badge { font-weight: 700; }
      .rate-badge.achieved { color: var(--good); }
      .rate-badge.behind { color: var(--bad); }
      .alert-box { background: var(--warn-soft); color: var(--warn); padding: 10px 14px; border-radius: var(--radius-sm); font-size: 0.9em; margin-bottom: var(--space-sm); }

      .daily-summary-row { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-md); margin-bottom: var(--space-md); }
      @media (max-width: 480px) { .daily-summary-row { grid-template-columns: 1fr; } }
      .daily-summary-tile .kpi-label { font-size: 0.78em; color: var(--ink-muted); }
      .daily-summary-tile .kpi-value-row { display: flex; align-items: baseline; gap: 6px; margin-top: 2px; }
      .daily-summary-tile .kpi-value { font-size: 1.5em; font-weight: 700; font-variant-numeric: tabular-nums; }
      .daily-summary-tile .kpi-sub { font-size: 0.78em; color: var(--ink-muted); font-variant-numeric: tabular-nums; margin-top: 2px; }
      .daily-summary-tile .kpi-sub.diff-zero { color: var(--ink-muted); }
      .daily-summary-tile .kpi-sub.diff-up { color: var(--good); }
      .daily-summary-tile .kpi-sub.diff-down { color: var(--bad); }
      .cross-link, .drill-link { display: inline-flex; align-items: center; gap: 4px; font-family: inherit; font-size: 0.85em; font-weight: 700; text-decoration: none; border-radius: var(--radius-sm); border: 1px solid var(--border); background: var(--surface); color: var(--ink); padding: 6px 12px; white-space: nowrap; }
      .cross-link:hover, .drill-link:hover { border-color: var(--ai); color: var(--ai); }
      .cross-link { margin-top: var(--space-md); }
      .drill-link { padding: 4px 10px; }

      .modal-overlay { position: fixed; inset: 0; background: rgba(35, 38, 43, 0.4); display: none; align-items: center; justify-content: center; z-index: 40; }
      .modal-overlay.show { display: flex; }
      .modal-box { background: var(--surface); border-radius: var(--radius-md); padding: var(--space-md) var(--space-lg); max-width: 340px; width: 90%; position: relative; }
      .modal-close { position: absolute; top: var(--space-sm); right: var(--space-sm); }
      .confirm-modal-header { display: flex; align-items: center; gap: var(--space-sm); }
      .confirm-modal-header h2 { margin: 0; }
      .confirm-modal-icon { width: 1.4em; height: 1.4em; color: var(--warn); flex-shrink: 0; }
    </style>
  </head>

    <script>
      var MONTHS = ['01', '02', '03', '04', '05', '06', '07', '08', '09', '10', '11', '12'];

      function escapeAttr(str) {
        return String(str || '').replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;');
      }
      function flashSaved(id) {
        var flash = document.getElementById(id);
        flash.textContent = '保存しました';
        setTimeout(function () { flash.textContent = ''; }, 1500);
      }

      // 編集中に移動しようとした場合の確認（保存されていない変更を破棄してよいか）。
      // ブラウザ標準のconfirm()はscript.google.comが表示している警告のように見えて紛らわしいため使わない
      var confirmPendingAction = null;
      function guardNavigation(isEditing, action) {
        if (!isEditing) {
          action();
          return;
        }
        confirmPendingAction = action;
        document.getElementById('confirm-modal').classList.add('show');
      }
      function closeConfirmModal() {
        confirmPendingAction = null;
        document.getElementById('confirm-modal').classList.remove('show');
      }
      document.getElementById('confirm-modal-close').addEventListener('click', closeConfirmModal);
      document.getElementById('confirm-modal-discard').addEventListener('click', function () {
        var action = confirmPendingAction;
        confirmPendingAction = null;
        document.getElementById('confirm-modal').classList.remove('show');
        if (action) { action(); }
      });
      // 「保存して移動」：編集中のタブを保存してから、保留していた移動先の処理を実行する
      document.getElementById('confirm-modal-save').addEventListener('click', function () {
        var action = confirmPendingAction;
        confirmPendingAction = null;
        document.getElementById('confirm-modal').classList.remove('show');
        if (!action) { return; }
        if (monthlyEditing) {
          saveMonthlyAndThen(action);
        } else if (dailyEditing) {
          saveDailyAndThen(action);
        } else {
          action();
        }
      });

      // ポップアップは領域外（オーバーレイの背景部分）クリックでも閉じる
      document.querySelectorAll('.modal-overlay').forEach(function (overlay) {
        overlay.addEventListener('click', function (event) {
          if (event.target === overlay) {
            confirmPendingAction = null;
            overlay.classList.remove('show');
          }
        });
      });

      document.querySelectorAll('#budget-tabs .toggle-tab').forEach(function (btn) {
        btn.addEventListener('click', function () {
          guardNavigation(monthlyDirty || dailyDirty, function () {
            exitMonthlyEditing();
            exitDailyEditing();
            document.querySelectorAll('#budget-tabs .toggle-tab').forEach(function (b) { b.classList.remove('active'); });
            btn.classList.add('active');
            var tab = btn.dataset.tab;
            document.getElementById('panel-monthly').classList.toggle('active', tab === 'monthly');
            document.getElementById('panel-daily').classList.toggle('active', tab === 'daily');
            setLoadError('load-error', '');
            if (tab === 'daily' && !dailyLoadedOnce) { loadDaily(); }
          });
        });
      });

      /* ================= 月別予算設定 ================= */
      var monthlyYear = new Date().getFullYear();
      var monthlyData = [];
      var monthlyEditing = false;
      var monthlyDirty = false; // 編集モードに入っただけでなく、実際に値を変更したかどうか

      function setMonthlyLoading(isLoading) {
        document.getElementById('budget-body').classList.toggle('loading-target', isLoading);
        document.getElementById('budget-loading-wrap').classList.toggle('is-loading', isLoading);
      }

      function loadMonthly() {
        setLoadError('load-error', '');
        document.getElementById('year-label').textContent = monthlyYear + '年';
        setMonthlyLoading(true);
        google.script.run
          .withSuccessHandler(function (months) {
            setMonthlyLoading(false);
            setLoadError('load-error', '');
            monthlyData = months;
            renderMonthly();
          })
          .withFailureHandler(function (error) {
            setMonthlyLoading(false);
            setLoadError('load-error', 'データの取得に失敗しました：' + error.message, loadMonthly);
          })
          .getBudgetDataForYear(monthlyYear);
      }

      function rateBadgeHtml(rate) {
        if (rate === null || rate === undefined) {
          return '-';
        }
        return '<span class="rate-badge ' + (rate >= 100 ? 'achieved' : 'behind') + '">' + rate + '%</span>';
      }

      function renderMonthly() {
        var tbody = document.getElementById('budget-table-body');
        tbody.innerHTML = '';
        monthlyData.forEach(function (m, i) {
          var monthNum = Number(m.targetMonth.split('-')[1]);
          var tr = document.createElement('tr');
          var drillCell = '<td><a class="drill-link" href="#" data-month="' + m.targetMonth + '">日別へ</a></td>';
          if (monthlyEditing) {
            tr.innerHTML =
              '<td>' + monthNum + '月</td>' +
              '<td><input type="number" class="cell-input" min="0" step="1000" inputmode="numeric" data-i="' + i + '" data-field="targetAmount" value="' + (m.targetAmount || '') + '"></td>' +
              '<td>' + m.actualAmount.toLocaleString() + '</td>' +
              '<td>' + rateBadgeHtml(m.achievementRate) + '</td>' +
              '<td><input type="text" class="cell-input" data-i="' + i + '" data-field="note" value="' + escapeAttr(m.note) + '"></td>' +
              drillCell;
          } else {
            tr.innerHTML =
              '<td>' + monthNum + '月</td>' +
              '<td class="readonly-cell">' + (m.targetAmount ? m.targetAmount.toLocaleString() : '-') + '</td>' +
              '<td>' + m.actualAmount.toLocaleString() + '</td>' +
              '<td>' + rateBadgeHtml(m.achievementRate) + '</td>' +
              '<td class="readonly-cell">' + escapeAttr(m.note) + '</td>' +
              drillCell;
          }
          tbody.appendChild(tr);
        });

        if (monthlyEditing) {
          tbody.querySelectorAll('.cell-input').forEach(function (input) {
            input.addEventListener('input', function () {
              monthlyData[Number(input.dataset.i)][input.dataset.field] = input.value;
              monthlyDirty = true;
            });
          });
        }
        tbody.querySelectorAll('.drill-link').forEach(function (link) {
          link.addEventListener('click', function (event) {
            event.preventDefault();
            goToDailyMonth(link.dataset.month);
          });
        });
      }

      // 月別予算設定の行から、その月を選択した状態で日別予算設定タブへ遷移する
      function goToDailyMonth(yearMonth) {
        guardNavigation(monthlyDirty || dailyDirty, function () {
          exitMonthlyEditing();
          exitDailyEditing();
          document.querySelectorAll('#budget-tabs .toggle-tab').forEach(function (b) { b.classList.remove('active'); });
          document.querySelector('#budget-tabs .toggle-tab[data-tab="daily"]').classList.add('active');
          document.getElementById('panel-monthly').classList.remove('active');
          document.getElementById('panel-daily').classList.add('active');
          setLoadError('load-error', '');
          dailyMonth = yearMonth;
          dailyLoadedOnce = true;
          loadDaily();
        });
      }

      function exitMonthlyEditing() {
        if (!monthlyEditing) { return; }
        monthlyEditing = false;
        monthlyDirty = false;
        document.getElementById('monthly-view-actions').style.display = '';
        document.getElementById('monthly-edit-actions').style.display = 'none';
        loadMonthly();
      }
      document.getElementById('monthly-edit-btn').addEventListener('click', function () {
        monthlyEditing = true;
        monthlyDirty = false;
        document.getElementById('monthly-view-actions').style.display = 'none';
        document.getElementById('monthly-edit-actions').style.display = '';
        renderMonthly();
      });
      document.getElementById('monthly-cancel-btn').addEventListener('click', exitMonthlyEditing);
      document.getElementById('monthly-bulk-btn').addEventListener('click', function () {
        document.getElementById('bulk-amount-input').value = '';
        document.getElementById('bulk-modal').classList.add('show');
      });
      document.getElementById('bulk-modal-close').addEventListener('click', function () {
        document.getElementById('bulk-modal').classList.remove('show');
      });
      document.getElementById('bulk-modal-confirm').addEventListener('click', function () {
        var amount = document.getElementById('bulk-amount-input').value;
        if (amount === '' || Number(amount) < 0) {
          return;
        }
        monthlyData.forEach(function (m) { m.targetAmount = amount; });
        monthlyDirty = true;
        document.getElementById('bulk-modal').classList.remove('show');
        renderMonthly();
      });
      function saveMonthlyAndThen(onSuccess, onFailure) {
        setLoadError('load-error', '');
        setMonthlyLoading(true);
        google.script.run
          .withSuccessHandler(function (months) {
            setMonthlyLoading(false);
            setLoadError('load-error', '');
            monthlyEditing = false;
            monthlyDirty = false;
            document.getElementById('monthly-view-actions').style.display = '';
            document.getElementById('monthly-edit-actions').style.display = 'none';
            monthlyData = months;
            renderMonthly();
            flashSaved('save-flash-monthly');
            if (onSuccess) { onSuccess(); }
          })
          .withFailureHandler(function (error) {
            setMonthlyLoading(false);
            setLoadError('load-error', '保存に失敗しました：' + error.message);
            if (onFailure) { onFailure(error); }
          })
          .saveBudgetTargetsForYear(monthlyYear, monthlyData.map(function (m) {
            return { targetMonth: m.targetMonth, targetAmount: m.targetAmount, note: m.note };
          }));
      }
      document.getElementById('monthly-save-btn').addEventListener('click', function () { saveMonthlyAndThen(); });
      document.getElementById('year-prev').addEventListener('click', function () {
        guardNavigation(monthlyDirty, function () {
          monthlyYear--;
          if (monthlyEditing) { exitMonthlyEditing(); } else { loadMonthly(); }
        });
      });
      document.getElementById('year-next').addEventListener('click', function () {
        guardNavigation(monthlyDirty, function () {
          monthlyYear++;
          if (monthlyEditing) { exitMonthlyEditing(); } else { loadMonthly(); }
        });
      });

      /* ================= 日別予算設定 ================= */
      var dailyMonth = currentYearMonth_();
      var dailyPlan = null;   // サーバーから取得した最新の確定データ
      var dailyDays = [];     // 編集中のローカル状態（[{date, day, targetAmount}]、targetAmountはnull=未設定）
      var dailyEditing = false;
      var dailyDirty = false; // 編集モードに入っただけでなく、実際に値を変更したかどうか
      var dailyLoadedOnce = false;

      function currentYearMonth_() {
        var d = new Date();
        return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2);
      }
      function shiftYearMonth_(value, direction) {
        var parts = value.split('-');
        var d = new Date(Number(parts[0]), Number(parts[1]) - 1 + direction, 1);
        return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2);
      }

      function setDailyLoading(isLoading) {
        document.getElementById('daily-body').classList.toggle('loading-target', isLoading);
        document.getElementById('daily-loading-wrap').classList.toggle('is-loading', isLoading);
      }

      // 年×12マスの月選択ポップオーバー（共通部品。shared/javascript.html参照）
      var dailyMonthPicker = createMonthPicker({
        btnId: 'daily-month-btn',
        popoverId: 'daily-month-popover',
        yearLabelId: 'daily-picker-year-label',
        gridId: 'daily-picker-grid',
        yearPrevId: 'daily-picker-year-prev',
        yearNextId: 'daily-picker-year-next',
        getCurrentMonth: function () { return dailyMonth; },
        onSelect: function (newMonth) {
          guardNavigation(dailyDirty, function () { leaveDailyMonth(); dailyMonth = newMonth; loadDaily(); });
        }
      });

      function loadDaily() {
        setLoadError('load-error', '');
        dailyMonthPicker.refreshLabel();
        setDailyLoading(true);
        google.script.run
          .withSuccessHandler(function (plan) {
            setDailyLoading(false);
            setLoadError('load-error', '');
            dailyLoadedOnce = true;
            dailyPlan = plan;
            resetDailyLocalState();
            renderDaily();
          })
          .withFailureHandler(function (error) {
            setDailyLoading(false);
            setLoadError('load-error', 'データの取得に失敗しました：' + error.message, loadDaily);
          })
          .getDailyTargetsForMonth(dailyMonth);
      }

      function resetDailyLocalState() {
        dailyDays = dailyPlan.days.map(function (d) { return { date: d.date, day: d.day, targetAmount: d.targetAmount, isHoliday: d.isHoliday }; });
      }

      function fallbackDayAmount() {
        return dailyPlan.hasMonthTarget ? Math.round(dailyPlan.monthTargetAmount / dailyPlan.daysInMonth) : null;
      }

      function updateDailySummary() {
        document.getElementById('daily-no-target-alert').style.display = dailyPlan.hasMonthTarget ? 'none' : '';
        document.getElementById('daily-summary-row').style.display = dailyPlan.hasMonthTarget ? '' : 'none';
        if (!dailyPlan.hasMonthTarget) {
          return;
        }
        var fallback = fallbackDayAmount();
        var dailyTotal = dailyDays.reduce(function (sum, d) {
          return sum + (d.targetAmount !== null && d.targetAmount !== '' ? Number(d.targetAmount) : fallback);
        }, 0);
        var diff = dailyTotal - dailyPlan.monthTargetAmount;
        document.getElementById('daily-summary-month-target').textContent = '¥' + dailyPlan.monthTargetAmount.toLocaleString();
        document.getElementById('daily-summary-per-day').textContent = '日割り目安：¥' + fallback.toLocaleString() + '/日';
        document.getElementById('daily-summary-total').textContent = '¥' + dailyTotal.toLocaleString();
        var diffEl = document.getElementById('daily-summary-diff');
        diffEl.textContent = '月間目標比：' + (diff > 0 ? '+' : diff < 0 ? '−' : '') + '¥' + Math.abs(diff).toLocaleString();
        diffEl.className = 'kpi-sub ' + (diff === 0 ? 'diff-zero' : diff > 0 ? 'diff-up' : 'diff-down');
      }

      function renderDaily() {
        updateDailySummary();

        var grid = document.getElementById('daily-cal-grid');
        grid.innerHTML = '';

        var startWeekday = new Date(dailyDays[0].date + 'T00:00:00').getDay();
        for (var i = 0; i < startWeekday; i++) {
          var pad = document.createElement('div');
          pad.className = 'cal-cell empty';
          grid.appendChild(pad);
        }

        dailyDays.forEach(function (d, i) {
          var weekday = new Date(d.date + 'T00:00:00').getDay();
          var cellClass = 'cal-cell' + (d.isHoliday ? ' holiday' : weekday === 0 ? ' sun' : weekday === 6 ? ' sat' : '');
          var cell = document.createElement('div');
          cell.className = cellClass;
          var num = document.createElement('div');
          num.className = 'cal-day-num';
          num.textContent = d.day;
          cell.appendChild(num);

          if (dailyEditing) {
            var fb = fallbackDayAmount();
            var input = document.createElement('input');
            input.type = 'number';
            input.min = '0';
            input.step = '1000';
            input.inputMode = 'numeric';
            if (fb !== null) { input.placeholder = String(fb); }
            input.value = d.targetAmount === null ? '' : d.targetAmount;
            input.addEventListener('input', function () {
              dailyDays[i].targetAmount = input.value === '' ? null : input.value;
              dailyDirty = true;
              updateDailySummary();
            });
            cell.appendChild(input);
          } else {
            var amt = document.createElement('div');
            if (d.targetAmount !== null) {
              amt.className = 'cal-amount';
              amt.textContent = d.targetAmount.toLocaleString();
            } else {
              var fbv = fallbackDayAmount();
              amt.className = 'cal-amount fallback';
              amt.textContent = fbv !== null ? fbv.toLocaleString() : '-';
            }
            cell.appendChild(amt);
          }
          grid.appendChild(cell);
        });
      }

      function exitDailyEditing() {
        if (!dailyEditing) { return; }
        dailyEditing = false;
        dailyDirty = false;
        document.getElementById('daily-view-actions').style.display = '';
        document.getElementById('daily-edit-actions').style.display = 'none';
        resetDailyLocalState();
        renderDaily();
      }
      document.getElementById('daily-edit-btn').addEventListener('click', function () {
        dailyEditing = true;
        dailyDirty = false;
        document.getElementById('daily-view-actions').style.display = 'none';
        document.getElementById('daily-edit-actions').style.display = '';
        renderDaily();
      });
      document.getElementById('daily-cancel-btn').addEventListener('click', exitDailyEditing);
      // 店休日（0を入力済みの日）は対象外にして残りの日数で均等割付する。
      // 店休日という別概念は持たず、「0を入力済みの日は除外する」というルールだけで実現している
      document.getElementById('daily-fill-btn').addEventListener('click', function () {
        if (!dailyPlan.hasMonthTarget) {
          setLoadError('load-error', 'この月の月目標が未設定のため均等割付できません。先に月別予算設定タブで登録してください。');
          return;
        }
        // 「店休日」判定は明示的に0が入力された日のみ対象にする。未入力（null）はNumber(null)===0に
        // なりJavaScript的には0と区別できないため、null／空文字を先に除外してから0判定する
        var isExplicitlyClosed = function (d) {
          return d.targetAmount !== null && d.targetAmount !== '' && Number(d.targetAmount) === 0;
        };
        var openDays = dailyDays.filter(function (d) { return !isExplicitlyClosed(d); });
        var divisor = openDays.length > 0 ? openDays.length : dailyDays.length;
        var even = Math.round(dailyPlan.monthTargetAmount / divisor);
        openDays.forEach(function (d) { d.targetAmount = even; });
        dailyDirty = true;
        renderDaily();
      });
      function saveDailyAndThen(onSuccess, onFailure) {
        setLoadError('load-error', '');
        setDailyLoading(true);
        google.script.run
          .withSuccessHandler(function (plan) {
            setDailyLoading(false);
            setLoadError('load-error', '');
            dailyEditing = false;
            dailyDirty = false;
            document.getElementById('daily-view-actions').style.display = '';
            document.getElementById('daily-edit-actions').style.display = 'none';
            dailyPlan = plan;
            resetDailyLocalState();
            renderDaily();
            flashSaved('save-flash-daily');
            if (onSuccess) { onSuccess(); }
          })
          .withFailureHandler(function (error) {
            setDailyLoading(false);
            setLoadError('load-error', '保存に失敗しました：' + error.message);
            if (onFailure) { onFailure(error); }
          })
          .saveDailyTargetsForMonth(dailyMonth, dailyDays.map(function (d) {
            return { date: d.date, targetAmount: d.targetAmount };
          }));
      }
      document.getElementById('daily-save-btn').addEventListener('click', function () { saveDailyAndThen(); });
      function leaveDailyMonth() {
        dailyEditing = false;
        dailyDirty = false;
        document.getElementById('daily-view-actions').style.display = '';
        document.getElementById('daily-edit-actions').style.display = 'none';
      }
      document.getElementById('daily-month-prev').addEventListener('click', function () {
        guardNavigation(dailyDirty, function () { leaveDailyMonth(); dailyMonth = shiftYearMonth_(dailyMonth, -1); loadDaily(); });
      });
      document.getElementById('daily-month-next').addEventListener('click', function () {
        guardNavigation(dailyDirty, function () { leaveDailyMonth(); dailyMonth = shiftYearMonth_(dailyMonth, 1); loadDaily(); });
      });


      // サイドバー等でページ自体を離れる場合も、編集中なら未保存の変更がある旨をブラウザ標準の
      // 離脱確認ダイアログで知らせる（これはGASの警告と紛らわしいalert/confirmとは別の、ブラウザ本体の機能）
      window.addEventListener('beforeunload', function (event) {
        if (monthlyDirty || dailyDirty) {
          event.preventDefault();
          event.returnValue = '';
        }
      });

      loadMonthly();
    </script>
  </body>
</html>
