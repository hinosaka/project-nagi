<!-- SCR-005 座席管理 -->
<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <?!= include('client/shared/stylesheet') ?>
    <style>
      .floor-plan {
        max-width: 640px;
      }
      .tables-row {
        display: flex;
        justify-content: space-evenly;
        margin-bottom: var(--space-md);
      }
      .counter-seats {
        display: flex;
        gap: var(--space-sm);
        justify-content: center;
        flex-wrap: nowrap;
        overflow-x: auto;
        padding-bottom: 4px;
      }
      .seat-box {
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        padding: var(--space-sm);
        min-width: 48px;
        flex-shrink: 0;
        text-align: center;
        background: var(--surface);
        cursor: pointer;
        line-height: 1.3;
      }
      .seat-box.table-box {
        min-width: 96px;
        padding: 18px;
        font-size: 1.15em;
      }
      .seat-box:hover {
        border-color: var(--ai);
      }
      .seat-box.selected {
        border-color: var(--ai);
        background: var(--ai-soft);
      }
      .seat-box.inactive {
        background: var(--surface-2);
        color: var(--ink-muted);
        border-color: var(--surface-2);
      }
      #seat-panel {
        max-width: 240px;
      }
      #seat-panel h2 {
        margin-top: 0;
      }
      .seat-legend {
        display: flex;
        gap: var(--space-md);
        font-size: 0.85em;
        color: var(--ink-muted);
        margin-bottom: var(--space-sm);
      }
      .seat-legend-swatch {
        display: inline-block;
        width: 14px;
        height: 14px;
        border-radius: 3px;
        border: 1px solid var(--border);
        margin-right: 4px;
        vertical-align: -2px;
        background: var(--surface);
      }
      .seat-legend-swatch.inactive {
        background: var(--surface-2);
        border-color: var(--surface-2);
      }
    </style>
  </head>
  <body data-page="<?= currentPage ?>">
    <?!= include('client/shared/icons') ?>
    <div class="app-shell">
      <?!= include('client/shared/sidebar', {baseUrl: baseUrl}) ?>
      <main class="main-content">
        <p>座席をクリックすると使用可否の切替メニューが開きます。</p>
        <div class="seat-legend">
          <span><span class="seat-legend-swatch"></span>使用可</span>
          <span><span class="seat-legend-swatch inactive"></span>使用不可</span>
        </div>

        <p id="load-error" class="error"></p>

        <div class="loading-wrap" id="seat-loading-wrap">
        <div class="loading-target">
          <div class="card floor-plan">
            <div class="tables-row" id="tables-row"></div>
            <div class="counter-seats" id="counter-seats"></div>
          </div>

          <div id="others-section" class="card" style="display:none;">
            <h2>レイアウト外の座席</h2>
            <div class="counter-seats" id="others-list"></div>
          </div>
        </div>
        <div class="loading-overlay"><div class="loading-overlay-pill"><span class="loading-spinner"></span><span id="seat-loading-text">読み込み中...</span></div></div>
        </div>

        <div id="seat-panel" class="card" style="display:none;">
          <h2 id="panel-title"></h2>
          <button type="button" id="toggle-active"></button>
        </div>
      </main>
    </div>

    <?!= include('client/shared/javascript') ?>
    <script>
      var KNOWN_LAYOUT = {
        tables: ['TB', 'TA'],
        counter: ['C8', 'C7', 'C6', 'C5', 'C4', 'C3', 'C2', 'C1']
      };
      var currentSeats = {};
      var editingSeatId = null;

      function setLoading(isLoading, text) {
        document.getElementById('seat-loading-wrap').classList.toggle('is-loading', isLoading);
        if (text) { document.getElementById('seat-loading-text').textContent = text; }
      }

      function loadSeatList() {
        document.getElementById('load-error').textContent = '';
        setLoading(true, '読み込み中...');
        google.script.run
          .withSuccessHandler(function (seatList) {
            setLoading(false);
            renderSeatList(seatList);
          })
          .withFailureHandler(function (error) {
            setLoading(false);
            document.getElementById('load-error').textContent = 'データの取得に失敗しました：' + error.message;
          })
          .getSeatList();
      }

      function renderSeatList(seatList) {
        currentSeats = {};
        seatList.forEach(function (s) {
          currentSeats[s.SeatId] = s;
        });

        renderSeatGroup('tables-row', KNOWN_LAYOUT.tables);
        renderSeatGroup('counter-seats', KNOWN_LAYOUT.counter);

        var knownIds = KNOWN_LAYOUT.tables.concat(KNOWN_LAYOUT.counter);
        var others = seatList.filter(function (s) {
          return knownIds.indexOf(s.SeatId) === -1;
        });
        renderSeatGroup('others-list', others.map(function (s) { return s.SeatId; }));
        document.getElementById('others-section').style.display = others.length === 0 ? 'none' : '';
      }

      function renderSeatGroup(containerId, seatIds) {
        var container = document.getElementById(containerId);
        container.innerHTML = '';
        seatIds.forEach(function (seatId) {
          var seat = currentSeats[seatId];
          if (!seat) {
            return;
          }
          container.appendChild(buildSeatBox(seat));
        });
      }

      function buildSeatBox(seat) {
        var box = document.createElement('div');
        box.className = 'seat-box'
          + (KNOWN_LAYOUT.tables.indexOf(seat.SeatId) !== -1 ? ' table-box' : '')
          + (seat.IsActive ? '' : ' inactive')
          + (seat.SeatId === editingSeatId ? ' selected' : '');
        box.dataset.seatId = seat.SeatId;
        box.innerHTML = seat.SeatId + '<br>(' + seat.Capacity + ')';
        box.addEventListener('click', function (event) {
          event.stopPropagation();
          openPanel(seat);
        });
        return box;
      }

      function updateSelectedBoxes() {
        document.querySelectorAll('.seat-box').forEach(function (box) {
          box.classList.toggle('selected', box.dataset.seatId === editingSeatId);
        });
      }

      function openPanel(seat) {
        editingSeatId = seat.SeatId;
        updateSelectedBoxes();
        document.getElementById('panel-title').textContent = seat.SeatId;
        var toggleBtn = document.getElementById('toggle-active');
        toggleBtn.textContent = seat.IsActive ? '無効にする' : '有効にする';
        toggleBtn.className = seat.IsActive ? 'btn-danger' : 'btn-success';
        document.getElementById('seat-panel').style.display = '';
      }

      function closePanel() {
        editingSeatId = null;
        updateSelectedBoxes();
        document.getElementById('seat-panel').style.display = 'none';
      }

      document.addEventListener('click', function (event) {
        var panel = document.getElementById('seat-panel');
        if (panel.style.display !== 'none' && !event.target.closest('#seat-panel')) {
          closePanel();
        }
      });

      document.getElementById('toggle-active').addEventListener('click', function () {
        setLoading(true, '適用中...');
        google.script.run
          .withSuccessHandler(function () {
            closePanel();
            loadSeatList();
          })
          .withFailureHandler(function (error) {
            setLoading(false);
            document.getElementById('load-error').textContent = '更新に失敗しました：' + error.message;
          })
          .toggleSeatActive(editingSeatId);
      });

      loadSeatList();
    </script>
  </body>
</html>
