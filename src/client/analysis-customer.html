<!-- SCR-009 顧客分析 -->
<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <?!= include('client/shared/stylesheet') ?>
    <style>
      .period-row {
        display: flex;
        align-items: center;
        gap: var(--space-sm);
        margin-bottom: var(--space-md);
        flex-wrap: wrap;
      }
      #reference-date {
        width: 32px;
        height: 32px;
        color: transparent;
        background: var(--ai-soft);
        border: 1px solid var(--ai-soft);
        border-radius: var(--radius-sm);
        padding: 4px;
        cursor: pointer;
      }
      #reference-date::-webkit-calendar-picker-indicator {
        opacity: 1;
        cursor: pointer;
      }
      .period-nav {
        display: flex;
        align-items: center;
        gap: 4px;
      }
      #period-label {
        color: var(--ink-muted);
        font-weight: bold;
      }
      .split-bar .segment-new {
        background: var(--ai);
      }
      .split-bar .segment-repeat {
        background: var(--good);
      }
      .dot-new { background: var(--ai); }
      .dot-repeat { background: var(--good); }
      .note-text {
        color: var(--ink-muted);
        font-size: 0.85em;
      }
      .back-link {
        display: inline-block;
        margin-top: var(--space-md);
      }
    </style>
  </head>
  <body data-page="<?= currentPage ?>">
    <?!= include('client/shared/icons') ?>
    <div class="app-shell">
      <?!= include('client/shared/sidebar', {baseUrl: baseUrl}) ?>
      <main class="main-content">
        <h1>顧客分析</h1>

        <div class="period-row">
          <div class="tabs" id="period-tabs"></div>
          <input type="date" id="reference-date" title="基準日を選択">
          <span class="period-nav">
            <button type="button" class="icon-btn" id="period-prev" title="前へ"><svg class="icon"><use href="#icon-chevron-left"></use></svg></button>
            <span>期間：<span id="period-label"></span></span>
            <button type="button" class="icon-btn" id="period-next" title="次へ"><svg class="icon"><use href="#icon-chevron-right"></use></svg></button>
          </span>
        </div>

        <p id="load-error" class="error"></p>

        <div class="kpi-row">
          <div class="kpi-tile primary">
            <div class="kpi-label">常連率</div>
            <div class="kpi-value"><span id="kpi-rate">-</span></div>
          </div>
          <div class="kpi-tile">
            <div class="kpi-label">新規来店</div>
            <div class="kpi-value"><span id="kpi-new">0</span>組</div>
          </div>
          <div class="kpi-tile">
            <div class="kpi-label">リピート来店</div>
            <div class="kpi-value"><span id="kpi-repeat">0</span>組</div>
          </div>
        </div>

        <div class="card">
          <h2>新規 / リピート内訳</h2>
          <div class="split-bar">
            <div class="segment-new" id="split-new"></div>
            <div class="segment-repeat" id="split-repeat"></div>
          </div>
          <div class="legend">
            <span><span class="dot dot-new"></span>新規　<span id="new-count">0</span>組（<span id="new-ratio">0</span>%）・¥<span id="new-amount">0</span></span>
            <span><span class="dot dot-repeat"></span>リピート　<span id="repeat-count">0</span>組（<span id="repeat-ratio">0</span>%）・¥<span id="repeat-amount">0</span></span>
          </div>
          <p class="note-text">顧客が紐づいていない会計：<span id="no-customer-count">0</span>組（常連率の算出対象外）</p>
        </div>

        <a class="back-link" href="<?= baseUrl ?>?page=dashboard">← ダッシュボードに戻る</a>
      </main>
    </div>

    <?!= include('client/shared/javascript') ?>
    <script>
      var periodController = createPeriodController({
        tabsEl: document.getElementById('period-tabs'),
        dateEl: document.getElementById('reference-date'),
        prevBtn: document.getElementById('period-prev'),
        nextBtn: document.getElementById('period-next'),
        periodLabels: { day: '日次', week: '週次', month: '月次' },
        initialPeriod: 'day',
        onChange: loadAnalysis
      });

      function loadAnalysis() {
        document.getElementById('load-error').textContent = '';
        google.script.run
          .withSuccessHandler(renderAnalysis)
          .withFailureHandler(function (error) {
            document.getElementById('load-error').textContent = 'データの取得に失敗しました：' + error.message;
          })
          .getCustomerAnalysisData(periodController.getPeriod(), periodController.getDate());
      }

      function renderAnalysis(data) {
        document.getElementById('period-label').textContent = data.periodLabel;
        document.getElementById('kpi-rate').textContent = data.regularRate === null ? '対象なし' : data.regularRate + '%';
        document.getElementById('kpi-new').textContent = data.newCount;
        document.getElementById('kpi-repeat').textContent = data.repeatCount;

        var total = data.linkedTotal;
        var newRatio = total > 0 ? Math.round((data.newCount / total) * 100) : 0;
        var repeatRatio = total > 0 ? 100 - newRatio : 0;

        document.getElementById('new-count').textContent = data.newCount;
        document.getElementById('new-ratio').textContent = newRatio;
        document.getElementById('new-amount').textContent = data.newAmount;
        document.getElementById('repeat-count').textContent = data.repeatCount;
        document.getElementById('repeat-ratio').textContent = repeatRatio;
        document.getElementById('repeat-amount').textContent = data.repeatAmount;
        document.getElementById('no-customer-count').textContent = data.noCustomerCount;
        document.getElementById('split-new').style.width = newRatio + '%';
        document.getElementById('split-repeat').style.width = repeatRatio + '%';
      }

      loadAnalysis();
    </script>
  </body>
</html>
