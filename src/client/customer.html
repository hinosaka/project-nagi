<!-- SCR-004 顧客管理 -->
<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <?!= include('client/shared/stylesheet') ?>
    <style>
      .modal-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(35, 38, 43, 0.4);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .modal-box {
        background: var(--surface);
        border-radius: var(--radius-md);
        padding: var(--space-md) var(--space-lg);
        max-width: 380px;
        width: 90%;
        max-height: 85vh;
        overflow-y: auto;
      }
      .detail-header {
        display: flex;
        align-items: center;
        gap: var(--space-sm);
        margin-bottom: 2px;
      }
      .detail-person-icon {
        width: 1.6em;
        height: 1.6em;
        color: var(--ai);
      }
      .detail-header h2 {
        margin: 0;
        border-bottom: none;
        padding-bottom: 0;
      }
      .detail-visit-info {
        margin: 0 0 var(--space-md);
      }
      .visit-badge {
        display: inline-block;
        padding: 2px 10px;
        border-radius: 999px;
        font-size: 0.85em;
        margin-right: 6px;
      }
      .visit-count {
        background: var(--ai-soft);
        color: var(--ai);
      }
      .visit-last {
        background: var(--good-soft);
        color: var(--good);
      }
      .detail-phone-row {
        display: flex;
        align-items: center;
        gap: var(--space-sm);
        margin-bottom: var(--space-sm);
      }
      .detail-field-icon {
        color: var(--ink-muted);
        display: inline-flex;
      }
      #detail-phone {
        flex: 1;
        border: none;
        background: transparent;
        padding: 4px 2px;
      }
      #detail-phone:focus {
        outline: none;
        border-bottom: 1px solid var(--ai);
      }
      .memo-row {
        display: flex;
        gap: var(--space-sm);
        align-items: flex-start;
      }
      .memo-row textarea {
        flex: 1;
        min-height: 60px;
        border: none;
        background: transparent;
        padding: 4px 2px;
      }
      .memo-row textarea:focus {
        outline: none;
        border-bottom: 1px solid var(--ai);
      }
      .customer-name-link {
        color: var(--ink);
        font-weight: 700;
        cursor: pointer;
      }
      .th-with-info {
        display: flex;
        align-items: center;
        gap: 4px;
      }
      .register-row {
        display: flex;
        align-items: flex-end;
        gap: var(--space-sm);
      }
      .register-row .form-row {
        margin-bottom: 0;
      }
    </style>
  </head>
  <body data-page="<?= currentPage ?>">
    <?!= include('client/shared/icons') ?>
    <div class="app-shell">
      <?!= include('client/shared/sidebar', {baseUrl: baseUrl}) ?>
      <main class="main-content">
        <div class="card">
          <form id="register-form" class="register-row">
            <div class="form-row">
              <label for="CustomerName">ニックネーム</label>
              <input type="text" id="CustomerName" required>
            </div>
            <button type="submit">新規登録</button>
          </form>
          <p id="form-error" class="error"></p>
        </div>

        <h2>顧客一覧</h2>
        <p id="list-error" class="error"></p>
        <div class="table-scroll">
          <table id="customer-table">
            <thead>
              <tr>
                <th>
                  <span class="th-with-info">
                    ニックネーム
                    <span class="popover-wrap">
                      <button type="button" class="info-btn" title="説明を表示"><svg class="icon"><use href="#icon-info"></use></svg></button>
                      <span class="popover">ニックネームをクリックすると、来店履歴やメモなどの詳細を確認・編集できます。</span>
                    </span>
                  </span>
                </th>
                <th>来店回数</th>
                <th>最終来店日</th>
                <th>初回来店日</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </main>
    </div>

    <div class="modal-overlay" id="detail-modal" style="display:none;">
      <div class="modal-box">
        <div class="detail-header">
          <svg class="icon detail-person-icon"><use href="#icon-user"></use></svg>
          <h2 id="detail-title"></h2>
        </div>
        <p id="detail-visit-info" class="detail-visit-info">
          <span class="visit-badge visit-count" id="detail-visit-count"></span>
          <span class="visit-badge visit-last" id="detail-last-visit"></span>
        </p>

        <div class="detail-phone-row">
          <span class="detail-field-icon" title="電話番号"><svg class="icon"><use href="#icon-phone"></use></svg></span>
          <input type="text" id="detail-phone" placeholder="電話番号（任意）">
          <button type="button" class="icon-btn" id="detail-phone-edit" title="編集"><svg class="icon"><use href="#icon-edit"></use></svg></button>
        </div>

        <div class="form-row">
          <label for="detail-memo"><svg class="icon"><use href="#icon-tag"></use></svg>メモ</label>
          <div class="memo-row">
            <textarea id="detail-memo"></textarea>
            <button type="button" class="icon-btn" id="detail-save" title="保存"><svg class="icon"><use href="#icon-check"></use></svg></button>
          </div>
        </div>

        <h3>よく注文する商品 TOP3</h3>
        <ol id="detail-top-ranking" class="ranking-list"></ol>

        <h3>その他の注文</h3>
        <ol id="detail-other-ranking" class="ranking-list"></ol>

        <div class="form-row form-actions">
          <button type="button" id="detail-close">顧客一覧に戻る</button>
        </div>
        <p id="detail-error" class="error"></p>
      </div>
    </div>

    <?!= include('client/shared/javascript') ?>
    <script>
      var currentCustomers = {};

      function loadCustomerList() {
        document.getElementById('list-error').textContent = '';
        google.script.run
          .withSuccessHandler(renderCustomerList)
          .withFailureHandler(function (error) {
            document.getElementById('list-error').textContent = '一覧の取得に失敗しました：' + error.message;
          })
          .getCustomerList();
      }

      function renderCustomerList(customerList) {
        currentCustomers = {};
        var tbody = document.querySelector('#customer-table tbody');
        tbody.innerHTML = '';
        customerList.forEach(function (customer) {
          currentCustomers[customer.CustomerId] = customer;

          var tr = document.createElement('tr');

          var nameTd = document.createElement('td');
          var nameLink = document.createElement('span');
          nameLink.className = 'customer-name-link';
          nameLink.textContent = customer.CustomerName;
          nameLink.addEventListener('click', function () {
            openDetail(customer.CustomerId);
          });
          nameTd.appendChild(nameLink);
          tr.appendChild(nameTd);

          tr.appendChild(cell(customer.VisitCount));
          tr.appendChild(cell(customer.LastVisitDate));
          tr.appendChild(cell(customer.FirstVisitDate));

          tbody.appendChild(tr);
        });
      }

      function cell(value) {
        var td = document.createElement('td');
        td.textContent = value;
        return td;
      }

      function openDetail(customerId) {
        var customer = currentCustomers[customerId];
        document.getElementById('detail-title').textContent = customer.CustomerName;

        document.getElementById('detail-visit-count').textContent = (customer.VisitCount || 0) + '回目来店';
        document.getElementById('detail-last-visit').textContent = customer.LastVisitDate ? ('前回 ' + customer.LastVisitDate) : '来店履歴なし';

        document.getElementById('detail-phone').value = customer.PhoneNumber || '';
        document.getElementById('detail-memo').value = customer.Memo || '';
        document.getElementById('detail-error').textContent = '';
        document.getElementById('detail-modal').dataset.customerId = customerId;
        document.getElementById('detail-modal').style.display = '';

        renderRanking('detail-top-ranking', [], 1);
        renderRanking('detail-other-ranking', [], 4);
        google.script.run
          .withSuccessHandler(function (result) {
            renderRanking('detail-top-ranking', result.top, 1);
            renderRanking('detail-other-ranking', result.others, result.top.length + 1);
          })
          .getCustomerOrderRanking(customerId);
      }

      function renderRanking(listId, items, startRank) {
        var list = document.getElementById(listId);
        list.setAttribute('start', startRank);
        list.innerHTML = '';
        if (items.length === 0) {
          var empty = document.createElement('li');
          empty.className = 'ranking-empty';
          empty.textContent = '該当する注文はまだありません。';
          list.appendChild(empty);
          return;
        }
        items.forEach(function (item) {
          var li = document.createElement('li');
          li.textContent = item.MenuName + '（' + item.Quantity + '点）';
          list.appendChild(li);
        });
      }

      function closeDetailModal() {
        document.getElementById('detail-modal').style.display = 'none';
      }

      document.getElementById('detail-phone-edit').addEventListener('click', function () {
        var input = document.getElementById('detail-phone');
        input.focus();
        input.select();
      });

      document.getElementById('detail-close').addEventListener('click', closeDetailModal);

      document.getElementById('detail-modal').addEventListener('click', function (event) {
        if (event.target === this) {
          closeDetailModal();
        }
      });

      document.getElementById('detail-save').addEventListener('click', function () {
        document.getElementById('detail-error').textContent = '';

        var detailInput = {
          CustomerId: document.getElementById('detail-modal').dataset.customerId,
          PhoneNumber: document.getElementById('detail-phone').value,
          Memo: document.getElementById('detail-memo').value
        };

        google.script.run
          .withSuccessHandler(function () {
            closeDetailModal();
            loadCustomerList();
          })
          .withFailureHandler(function (error) {
            document.getElementById('detail-error').textContent = error.message;
          })
          .saveCustomerDetail(detailInput);
      });

      document.getElementById('register-form').addEventListener('submit', function (event) {
        event.preventDefault();
        document.getElementById('form-error').textContent = '';

        var customerName = document.getElementById('CustomerName').value;

        google.script.run
          .withSuccessHandler(function () {
            document.getElementById('register-form').reset();
            loadCustomerList();
          })
          .withFailureHandler(function (error) {
            document.getElementById('form-error').textContent = error.message;
          })
          .registerCustomer(customerName);
      });

      loadCustomerList();
    </script>
  </body>
</html>
