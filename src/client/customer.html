<!-- SCR-004 顧客管理 -->
<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <?!= include('client/shared/stylesheet') ?>
    <style>
      .modal-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(35, 38, 43, 0.4);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .modal-box {
        background: var(--surface);
        border-radius: var(--radius-md);
        padding: var(--space-md) var(--space-lg);
        max-width: 380px;
        width: 90%;
        max-height: 85vh;
        overflow-y: auto;
        position: relative;
      }
      .modal-close {
        position: absolute;
        top: var(--space-sm);
        right: var(--space-sm);
      }
      .detail-header {
        display: flex;
        align-items: center;
        gap: var(--space-sm);
        margin-bottom: 2px;
        padding-right: 1.6em;
      }
      .detail-person-icon {
        width: 1.6em;
        height: 1.6em;
        color: var(--ai);
        flex-shrink: 0;
      }
      #detail-name {
        flex: 1;
        min-width: 0;
        font-size: 1.3em;
        font-weight: 700;
        border: none;
        background: transparent;
        padding: 2px;
        color: var(--ink);
      }
      #detail-name:focus {
        outline: none;
        border-bottom: 1px solid var(--ai);
      }
      .detail-visit-info {
        margin: 0 0 var(--space-md);
      }
      .visit-badge {
        display: inline-block;
        padding: 2px 10px;
        border-radius: 999px;
        font-size: 0.85em;
        margin-right: 6px;
      }
      .visit-count {
        background: var(--ai-soft);
        color: var(--ai);
      }
      .visit-last {
        background: var(--good-soft);
        color: var(--good);
      }
      .detail-phone-row {
        display: flex;
        align-items: center;
        gap: var(--space-sm);
        margin-bottom: var(--space-sm);
      }
      .detail-field-icon {
        color: var(--ink-muted);
        display: inline-flex;
      }
      #detail-phone {
        flex: 1;
        border: none;
        background: transparent;
        padding: 4px 2px;
      }
      #detail-phone:focus {
        outline: none;
        border-bottom: 1px solid var(--ai);
      }
      .memo-row {
        display: flex;
        gap: var(--space-sm);
        align-items: flex-start;
      }
      .memo-row textarea {
        flex: 1;
        min-height: 60px;
        border: none;
        background: transparent;
        padding: 4px 2px;
      }
      .memo-row textarea:focus {
        outline: none;
        border-bottom: 1px solid var(--ai);
      }
      .customer-name-link {
        color: var(--ink);
        font-weight: 700;
        cursor: pointer;
      }
      .th-with-info {
        display: flex;
        align-items: center;
        gap: 4px;
      }
      .register-row {
        display: flex;
        align-items: flex-end;
        gap: var(--space-sm);
      }
      .register-row .form-row {
        margin-bottom: 0;
      }
      #customer-table tbody tr:nth-child(even) {
        background: none;
      }

      /* ===== 注文履歴ランキング（ダッシュボードの商品別売上ランキングと同じ配色・表示方式） ===== */
      .rank-badge { display: inline-flex; align-items: center; justify-content: center; width: 22px; height: 22px; border-radius: 50%; background: var(--surface-2); color: var(--ink-muted); font-size: 0.8em; font-weight: 700; flex-shrink: 0; }
      .rank-badge.top3 { background: var(--warn-soft); color: var(--warn); }
      .ranking-row { display: flex; align-items: center; gap: var(--space-sm); padding: 7px 0; border-bottom: 1px solid var(--border); }
      .ranking-row .name { flex: 1; }
      .ranking-row .qty { font-variant-numeric: tabular-nums; color: var(--ink-muted); font-size: 0.9em; }

      /* ===== しばらく来店のない常連さん（来店2回以上・30日以上来店なし） ===== */
      .dormant-card { display: none; }
      .dormant-card.show { display: block; }
      .visit-row { display: flex; align-items: center; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--border); gap: var(--space-sm); }
      .visit-row:last-child { border-bottom: none; }
      .visit-name { font-weight: 700; cursor: pointer; color: var(--ink); }
      .visit-meta { font-size: 0.85em; color: var(--ink-muted); }
      .visit-badge { display: inline-block; background: var(--warn-soft); color: var(--warn); font-size: 0.78em; padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
    </style>
  </head>
  <body data-page="<?= currentPage ?>">
    <?!= include('client/shared/icons') ?>
    <div class="app-shell">
      <?!= include('client/shared/sidebar', {baseUrl: baseUrl}) ?>
      <main class="main-content">
        <div class="card">
          <form id="register-form" class="register-row">
            <div class="form-row">
              <label for="CustomerName">ニックネーム</label>
              <input type="text" id="CustomerName" required>
            </div>
            <button type="submit">新規登録</button>
          </form>
          <p id="form-error" class="error"></p>
        </div>

        <div class="card dormant-card" id="dormant-card">
          <h2 style="margin-top:0;">しばらく来店のない常連さん</h2>
          <div id="dormant-list"></div>
        </div>

        <h2>顧客一覧</h2>
        <div id="list-error" class="load-error"></div>
        <div class="loading-wrap" id="customer-loading-wrap">
        <div class="table-scroll loading-target">
          <table id="customer-table">
            <thead>
              <tr>
                <th>
                  <span class="th-with-info">
                    ニックネーム
                    <span class="popover-wrap">
                      <button type="button" class="info-btn" title="説明を表示"><svg class="icon"><use href="#icon-info"></use></svg></button>
                      <span class="popover">ニックネームをクリックすると、来店履歴やメモなどの詳細を確認・編集できます。</span>
                    </span>
                  </span>
                </th>
                <th>来店回数</th>
                <th>最終来店日</th>
                <th>初回来店日</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
        <div class="loading-overlay"><div class="loading-overlay-pill"><span class="loading-spinner"></span><span>読み込み中...</span></div></div>
        </div>
      </main>
    </div>

    <div class="modal-overlay" id="detail-modal" style="display:none;">
      <div class="modal-box">
        <button type="button" class="icon-btn modal-close" id="detail-close" title="閉じる">✕</button>
        <div class="detail-header">
          <svg class="icon detail-person-icon"><use href="#icon-user"></use></svg>
          <input type="text" id="detail-name">
        </div>
        <p id="detail-visit-info" class="detail-visit-info">
          <span class="visit-badge visit-count" id="detail-visit-count"></span>
          <span class="visit-badge visit-last" id="detail-last-visit"></span>
        </p>

        <div class="detail-phone-row">
          <span class="detail-field-icon" title="電話番号"><svg class="icon"><use href="#icon-phone"></use></svg></span>
          <input type="text" id="detail-phone" placeholder="電話番号（任意）">
        </div>

        <div class="form-row">
          <label for="detail-memo"><svg class="icon"><use href="#icon-tag"></use></svg>メモ</label>
          <div class="memo-row">
            <textarea id="detail-memo"></textarea>
          </div>
        </div>

        <h3>よく注文する商品 TOP3</h3>
        <div id="detail-top-ranking"></div>

        <h3>その他の注文</h3>
        <div id="detail-other-ranking"></div>

        <p id="detail-error" class="error"></p>
      </div>
    </div>

    <?!= include('client/shared/javascript') ?>
    <script>
      var currentCustomers = {};

      function setLoading(isLoading) {
        document.getElementById('customer-loading-wrap').classList.toggle('is-loading', isLoading);
      }

      function loadCustomerList() {
        setLoadError('list-error', '');
        setLoading(true);
        google.script.run
          .withSuccessHandler(function (customerList) {
            setLoading(false);
            setLoadError('list-error', '');
            renderCustomerList(customerList);
          })
          .withFailureHandler(function (error) {
            setLoading(false);
            setLoadError('list-error', '一覧の取得に失敗しました：' + error.message, loadCustomerList);
          })
          .getCustomerList();
      }

      function renderCustomerList(customerList) {
        currentCustomers = {};
        var tbody = document.querySelector('#customer-table tbody');
        tbody.innerHTML = '';
        customerList.forEach(function (customer) {
          currentCustomers[customer.CustomerId] = customer;

          var tr = document.createElement('tr');

          var nameTd = document.createElement('td');
          var nameLink = document.createElement('span');
          nameLink.className = 'customer-name-link';
          nameLink.textContent = customer.CustomerName;
          nameLink.addEventListener('click', function () {
            openDetail(customer.CustomerId);
          });
          nameTd.appendChild(nameLink);
          tr.appendChild(nameTd);

          tr.appendChild(cell(customer.VisitCount));
          tr.appendChild(cell(customer.LastVisitDate));
          tr.appendChild(cell(customer.FirstVisitDate));

          tbody.appendChild(tr);
        });

        renderDormantCustomers(customerList);
      }

      // 来店2回以上・30日以上来店なしの顧客を、経過日数が長い順に一覧表示する
      // （一見客を除外し、再来店を促したい常連さんに絞る。0件ならカード自体を隠す）
      function renderDormantCustomers(customerList) {
        var card = document.getElementById('dormant-card');
        var list = document.getElementById('dormant-list');
        var now = new Date();

        var dormant = customerList
          .filter(function (c) { return (c.VisitCount || 0) >= 2 && !!c.LastVisitDate; })
          .map(function (c) {
            var days = Math.floor((now - new Date(c.LastVisitDate)) / 86400000);
            return { customer: c, days: days };
          })
          .filter(function (entry) { return entry.days >= 30; })
          .sort(function (a, b) { return b.days - a.days; });

        card.classList.toggle('show', dormant.length > 0);
        list.innerHTML = '';
        dormant.forEach(function (entry) {
          var c = entry.customer;
          var row = document.createElement('div');
          row.className = 'visit-row';

          var left = document.createElement('div');
          var nameEl = document.createElement('span');
          nameEl.className = 'visit-name';
          nameEl.textContent = c.CustomerName;
          nameEl.addEventListener('click', function () { openDetail(c.CustomerId); });
          var meta = document.createElement('div');
          meta.className = 'visit-meta';
          meta.textContent = '来店' + c.VisitCount + '回・最終来店 ' + c.LastVisitDate;
          left.appendChild(nameEl);
          left.appendChild(meta);

          var badge = document.createElement('span');
          badge.className = 'visit-badge';
          badge.textContent = entry.days + '日経過';

          row.appendChild(left);
          row.appendChild(badge);
          list.appendChild(row);
        });
      }

      function cell(value) {
        var td = document.createElement('td');
        td.textContent = value;
        return td;
      }

      function openDetail(customerId) {
        var customer = currentCustomers[customerId];
        document.getElementById('detail-name').value = customer.CustomerName;

        document.getElementById('detail-visit-count').textContent = (customer.VisitCount || 0) + '回目来店';
        document.getElementById('detail-last-visit').textContent = customer.LastVisitDate ? ('前回 ' + customer.LastVisitDate) : '来店履歴なし';

        document.getElementById('detail-phone').value = customer.PhoneNumber || '';
        document.getElementById('detail-memo').value = customer.Memo || '';
        document.getElementById('detail-error').textContent = '';
        document.getElementById('detail-modal').dataset.customerId = customerId;
        document.getElementById('detail-modal').style.display = '';

        renderRanking('detail-top-ranking', [], 1);
        renderRanking('detail-other-ranking', [], 4);
        google.script.run
          .withSuccessHandler(function (result) {
            renderRanking('detail-top-ranking', result.top, 1);
            renderRanking('detail-other-ranking', result.others, result.top.length + 1);
          })
          .getCustomerOrderRanking(customerId);
      }

      function renderRanking(listId, items, startRank) {
        var container = document.getElementById(listId);
        container.innerHTML = '';
        if (items.length === 0) {
          var empty = document.createElement('p');
          empty.className = 'ranking-empty';
          empty.textContent = '該当する注文はまだありません。';
          container.appendChild(empty);
          return;
        }
        items.forEach(function (item, i) {
          var rank = startRank + i;
          var row = document.createElement('div');
          row.className = 'ranking-row';
          var badge = document.createElement('span');
          badge.className = 'rank-badge' + (rank <= 3 ? ' top3' : '');
          badge.textContent = rank;
          var name = document.createElement('span');
          name.className = 'name';
          name.textContent = item.MenuName;
          var qty = document.createElement('span');
          qty.className = 'qty';
          qty.textContent = item.Quantity + '点';
          row.appendChild(badge);
          row.appendChild(name);
          row.appendChild(qty);
          container.appendChild(row);
        });
      }

      function closeDetailModal() {
        document.getElementById('detail-modal').style.display = 'none';
        loadCustomerList();
      }

      document.getElementById('detail-close').addEventListener('click', closeDetailModal);

      document.getElementById('detail-modal').addEventListener('click', function (event) {
        if (event.target === this) {
          closeDetailModal();
        }
      });

      // ニックネーム・電話番号・メモは編集ボタン・保存ボタンを介さず、フォーカスを外した時点で自動保存する
      function saveDetailFields() {
        var customerId = document.getElementById('detail-modal').dataset.customerId;
        var customer = currentCustomers[customerId];
        if (!customer) {
          return;
        }

        var newName = document.getElementById('detail-name').value.trim();
        var newPhone = document.getElementById('detail-phone').value;
        var newMemo = document.getElementById('detail-memo').value;
        if (newName === customer.CustomerName && newPhone === (customer.PhoneNumber || '') && newMemo === (customer.Memo || '')) {
          return;
        }

        document.getElementById('detail-error').textContent = '';
        google.script.run
          .withSuccessHandler(function () {
            customer.CustomerName = newName;
            customer.PhoneNumber = newPhone;
            customer.Memo = newMemo;
          })
          .withFailureHandler(function (error) {
            document.getElementById('detail-error').textContent = error.message;
            document.getElementById('detail-name').value = customer.CustomerName;
            document.getElementById('detail-phone').value = customer.PhoneNumber || '';
            document.getElementById('detail-memo').value = customer.Memo || '';
          })
          .saveCustomerDetail({
            CustomerId: customerId,
            CustomerName: newName,
            PhoneNumber: newPhone,
            Memo: newMemo
          });
      }

      document.getElementById('detail-name').addEventListener('blur', saveDetailFields);
      document.getElementById('detail-phone').addEventListener('blur', saveDetailFields);
      document.getElementById('detail-memo').addEventListener('blur', saveDetailFields);

      document.getElementById('register-form').addEventListener('submit', function (event) {
        event.preventDefault();
        document.getElementById('form-error').textContent = '';

        var customerName = document.getElementById('CustomerName').value;

        google.script.run
          .withSuccessHandler(function () {
            document.getElementById('register-form').reset();
            loadCustomerList();
          })
          .withFailureHandler(function (error) {
            document.getElementById('form-error').textContent = error.message;
          })
          .registerCustomer(customerName);
      });

      loadCustomerList();
    </script>
  </body>
</html>
