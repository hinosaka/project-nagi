<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <?!= include('client/shared/stylesheet') ?>
    <style>
      /* ヘッダー行：単位トグル＋期間表示を横並び・コンパクトに */
      .header-row { display: flex; align-items: center; gap: var(--space-md); flex-wrap: wrap; margin-bottom: var(--space-md); }
      .toggle-tabs { display: inline-flex; background: var(--surface-2); border-radius: 999px; padding: 3px; flex-shrink: 0; }
      .toggle-tab { border: none; background: none; border-radius: 999px; padding: 6px 14px; font-weight: 700; font-size: 0.9em; color: var(--ink-muted); }
      .toggle-tab.active { background: var(--ai); color: #fff; }

      .sub-tabs { display: flex; gap: 2px; background: var(--surface-2); border-radius: var(--radius-sm); padding: 2px; }
      .sub-tab { border: none; background: none; border-radius: 4px; padding: 5px 10px; font-size: 0.85em; color: var(--ink-muted); }
      .sub-tab.active { background: var(--surface); color: var(--ai); font-weight: 700; }

      .period-controls { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-size: 0.9em; }
      .period-controls input[type="date"] { padding: 4px 6px; font-size: 0.9em; }
      .unit-label { color: var(--ink); font-weight: 700; white-space: nowrap; }
      .period-range-note { color: var(--ink-muted); font-size: 0.85em; width: 100%; }

      /* ===== 日付表示（会計処理と同じ：タップでネイティブのカレンダーを開く） ===== */
      .date-display-wrap { position: relative; display: inline-flex; align-items: center; gap: 6px; font-weight: 700; padding: 4px 8px; border-radius: var(--radius-sm); cursor: pointer; white-space: nowrap; }
      .date-display-wrap:hover { background: var(--ai-soft); color: var(--ai); }
      .date-display-wrap input[type="date"] { position: absolute; inset: 0; color: transparent; background: transparent; border: none; cursor: pointer; }
      .date-display-wrap input[type="date"]::-webkit-calendar-picker-indicator { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }

      /* 円グラフ */
      .pie-toggle { display: inline-flex; background: var(--surface-2); border-radius: 999px; padding: 3px; margin-bottom: var(--space-md); }
      .pie-toggle button { border: none; background: none; border-radius: 999px; padding: 6px 16px; font-weight: 700; color: var(--ink-muted); }
      .pie-toggle button.active { background: var(--ai); color: #fff; }
      .donut-body { display: flex; align-items: center; gap: var(--space-lg); flex-wrap: wrap; justify-content: center; }
      .donut-svg { width: 220px; height: 220px; flex-shrink: 0; overflow: visible; }
      .donut-svg text { font-size: 3.4px; fill: var(--ink-muted); font-variant-numeric: tabular-nums; }
      .donut-svg line { stroke: var(--ink-muted); stroke-width: 0.4; }
      .donut-legend { flex: 1; min-width: 220px; font-size: 0.88em; }
      .donut-legend-row { display: flex; align-items: center; gap: 6px; padding: 4px 0; justify-content: space-between; }
      .donut-legend-row .name { display: flex; align-items: center; gap: 6px; }
      .donut-legend-row .value { color: var(--ink-muted); font-variant-numeric: tabular-nums; }
      .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }

      td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
      /* この表は共通スタイルの縞模様（偶数行の背景色）をやめ単色にする */
      #detail-table tbody tr:nth-child(even) { background: none; }
    </style>
  </head>
  <body data-page="<?= currentPage ?>">
    <?!= include('client/shared/icons') ?>
    <div class="app-shell">
      <?!= include('client/shared/sidebar', {baseUrl: baseUrl}) ?>
      <main class="main-content">
        <div class="header-row">
          <div class="toggle-tabs" id="unit-tabs">
            <button type="button" class="toggle-tab active" data-unit="period">期間別売上</button>

          <div id="panel-period" class="period-controls">

              <button type="button" class="sub-tab active" data-sub="day">日次</button>

            </div>
            <span id="single-date-row">
              <button type="button" class="icon-btn" id="ref-date-prev"><svg class="icon"><use href="#icon-chevron-left"></use></svg></button>
              <span class="date-display-wrap" id="ref-date-wrap">
                <span id="ref-date-label"></span>
                <input type="date" id="ref-date-input" title="基準日を選択">

              <button type="button" class="icon-btn" id="ref-date-next"><svg class="icon"><use href="#icon-chevron-right"></use></svg></button>

              <input type="date" id="custom-start"> 〜 <input type="date" id="custom-end">

          <div id="panel-month" class="period-controls" style="display:none;">

              <div class="month-picker-popover" id="month-popover">
                <div class="month-picker-year-row">
                  <button type="button" class="icon-btn" id="month-picker-year-prev"><svg class="icon"><use href="#icon-chevron-left"></use></svg></button>
                  <span id="month-picker-year-label"></span>
                  <button type="button" class="icon-btn" id="month-picker-year-next"><svg class="icon"><use href="#icon-chevron-right"></use></svg></button>
                </div>
                <div class="month-picker-grid" id="month-picker-grid"></div>

            </div>
            <button type="button" class="icon-btn" id="month-next"><svg class="icon"><use href="#icon-chevron-right"></use></svg></button>

            <button type="button" class="icon-btn" id="year-prev"><svg class="icon"><use href="#icon-chevron-left"></use></svg></button>

        <div id="load-error" class="load-error"></div>

        <h2 style="margin-top:0;" id="pie-heading">商品別TOP5</h2>
        <div class="loading-wrap" id="analysis-loading-wrap">
        <div class="loading-target">
          <div class="card">
            <div class="pie-toggle" id="pie-toggle">
              <button type="button" class="active" data-pie="product">商品別</button>
              <button type="button" data-pie="category">カテゴリー別</button>
            </div>
            <div class="donut-body">
              <svg class="donut-svg" viewBox="-14 -14 70 70" id="donut-svg"></svg>
              <div class="donut-legend" id="donut-legend"></div>
            </div>
          </div>

          <div class="card">
            <div class="table-scroll">
              <table id="detail-table"></table>
            </div>
          </div>
        </div>
        <div class="loading-overlay"><div class="loading-overlay-pill"><span class="loading-spinner"></span><span>読み込み中...</span></div></div>
        </div>
      </main>
    </div>

    <?!= include('client/shared/javascript') ?>
    <script>
      var currentUnit = 'period';
      var currentSubPeriod = 'day';
      var refDate = todayStr();
      var currentMonth = todayStr().slice(0, 7);
      var currentYear = new Date().getFullYear();
      var currentPieView = 'product';
      var lastData = null;

      function todayStr() {
        var d = new Date();
        var mm = ('0' + (d.getMonth() + 1)).slice(-2);
        var dd = ('0' + d.getDate()).slice(-2);
        return d.getFullYear() + '-' + mm + '-' + dd;
      }
      function shiftDateStr(value, days) {
        var d = new Date(value);
        d.setDate(d.getDate() + days);
        var mm = ('0' + (d.getMonth() + 1)).slice(-2);
        var dd = ('0' + d.getDate()).slice(-2);
        return d.getFullYear() + '-' + mm + '-' + dd;
      }
      function shiftMonthStr(value, direction) {
        var parts = value.split('-');
        var d = new Date(Number(parts[0]), Number(parts[1]) - 1 + direction, 1);
        var mm = ('0' + (d.getMonth() + 1)).slice(-2);
        return d.getFullYear() + '-' + mm;
      }

      // 日付表示クリックでネイティブのカレンダーを開く（会計処理と同じ手法。隠したdate inputへの
      // クリック透過だけでは開かないブラウザがあるため、showPicker()を明示的に呼ぶ）
      function openDatePicker(inputEl) {
        if (typeof inputEl.showPicker === 'function') {
          try {
            inputEl.showPicker();
          } catch (e) {
            // 未対応・権限エラー等は無視（隠しinputへの直接クリックにフォールバック）
          }
        }
      }

      // 週次選択時の対象週（月曜始まり。サーバー側calcPeriodRange_のweek算出と同じ規則）
      function weekRangeLabel(dateStr) {
        var day = new Date(dateStr).getDay();
        var diffToMonday = (day === 0 ? -6 : 1 - day);
        var start = shiftDateStr(dateStr, diffToMonday);
        var end = shiftDateStr(start, 6);
        return '対象週：' + formatFullDateWithWeekday(start) + ' 〜 ' + formatFullDateWithWeekday(end);
      }

      /* ===== 単位トグル（期間別／月別／年別） ===== */
      document.querySelectorAll('#unit-tabs .toggle-tab').forEach(function (btn) {
        btn.addEventListener('click', function () {
          document.querySelectorAll('#unit-tabs .toggle-tab').forEach(function (b) { b.classList.remove('active'); });
          btn.classList.add('active');
          currentUnit = btn.dataset.unit;
          document.getElementById('panel-period').style.display = currentUnit === 'period' ? '' : 'none';
          document.getElementById('panel-month').style.display = currentUnit === 'month' ? '' : 'none';
          document.getElementById('panel-year').style.display = currentUnit === 'year' ? '' : 'none';
          loadAnalysis();
        });
      });

      /* ===== 期間別：サブタブ・日付ナビ ===== */
      document.querySelectorAll('#sub-tabs .sub-tab').forEach(function (btn) {
        btn.addEventListener('click', function () {
          document.querySelectorAll('#sub-tabs .sub-tab').forEach(function (b) { b.classList.remove('active'); });
          btn.classList.add('active');
          currentSubPeriod = btn.dataset.sub;
          var isCustom = currentSubPeriod === 'custom';
          document.getElementById('single-date-row').style.display = isCustom ? 'none' : '';
          document.getElementById('custom-range-row').style.display = isCustom ? 'inline' : 'none';
          renderRefDateLabel();
          loadAnalysis();
        });
      });
      function renderRefDateLabel() {
        document.getElementById('ref-date-label').textContent = formatFullDateWithWeekday(refDate);
        document.getElementById('ref-date-input').value = refDate;
        var isWeek = currentSubPeriod === 'week';
        var noteEl = document.getElementById('week-range-note');
        noteEl.style.display = isWeek ? '' : 'none';
        if (isWeek) {
          noteEl.textContent = weekRangeLabel(refDate);
        }
      }
      document.getElementById('ref-date-wrap').addEventListener('click', function () {
        openDatePicker(document.getElementById('ref-date-input'));
      });
      document.getElementById('ref-date-prev').addEventListener('click', function () {
        refDate = shiftDateStr(refDate, currentSubPeriod === 'week' ? -7 : -1);
        renderRefDateLabel();
        loadAnalysis();
      });
      document.getElementById('ref-date-next').addEventListener('click', function () {
        refDate = shiftDateStr(refDate, currentSubPeriod === 'week' ? 7 : 1);
        renderRefDateLabel();
        loadAnalysis();
      });
      document.getElementById('ref-date-input').addEventListener('change', function () {
        refDate = this.value;
        renderRefDateLabel();
        loadAnalysis();
      });
      document.getElementById('custom-start').addEventListener('change', loadAnalysis);
      document.getElementById('custom-end').addEventListener('change', loadAnalysis);

      /* ===== 月別（年×12マスの月選択ポップオーバー。共通部品。shared/javascript.html参照） ===== */
      var monthPicker = createMonthPicker({
        btnId: 'month-btn',
        popoverId: 'month-popover',
        yearLabelId: 'month-picker-year-label',
        gridId: 'month-picker-grid',
        yearPrevId: 'month-picker-year-prev',
        yearNextId: 'month-picker-year-next',
        getCurrentMonth: function () { return currentMonth; },
        onSelect: function (newMonth) { currentMonth = newMonth; renderMonthLabel(); loadAnalysis(); }
      });
      function renderMonthLabel() {
        monthPicker.refreshLabel();
      }
      document.getElementById('month-prev').addEventListener('click', function () {
        currentMonth = shiftMonthStr(currentMonth, -1);
        renderMonthLabel();
        loadAnalysis();
      });
      document.getElementById('month-next').addEventListener('click', function () {
        currentMonth = shiftMonthStr(currentMonth, 1);
        renderMonthLabel();
        loadAnalysis();
      });

      /* ===== 年別 ===== */
      function renderYearLabel() {
        document.getElementById('year-label').textContent = currentYear + '年';
      }
      document.getElementById('year-prev').addEventListener('click', function () {
        currentYear -= 1;
        renderYearLabel();
        loadAnalysis();
      });
      document.getElementById('year-next').addEventListener('click', function () {
        currentYear += 1;
        renderYearLabel();
        loadAnalysis();
      });

      /* ===== データ取得 ===== */
      function setLoading(isLoading) {
        document.getElementById('analysis-loading-wrap').classList.toggle('is-loading', isLoading);
      }

      function loadAnalysis() {
        setLoadError('load-error', '');
        setLoading(true);
        var periodType, referenceDateStr = '', startDateStr = '', endDateStr = '';

        if (currentUnit === 'period') {
          periodType = currentSubPeriod;
          if (periodType === 'custom') {
            startDateStr = document.getElementById('custom-start').value;
            endDateStr = document.getElementById('custom-end').value;
          } else {
            referenceDateStr = refDate;
          }
        } else if (currentUnit === 'month') {
          periodType = 'month';
          referenceDateStr = currentMonth + '-01';
        } else {
          periodType = 'year';
          referenceDateStr = currentYear + '-01-01';
        }

        google.script.run
          .withSuccessHandler(function (data) {
            setLoading(false);
            lastData = data;
            try {
              renderPieAndTable();
            } catch (e) {
              setLoadError('load-error', '表示処理でエラーが発生しました：' + (e && e.message ? e.message : e));
            }
          })
          .withFailureHandler(function (error) {
            setLoading(false);
            setLoadError('load-error', 'データの取得に失敗しました：' + error.message);
          })
          .getProductAnalysisData(periodType, referenceDateStr, startDateStr, endDateStr);
      }

      /* ===== 円グラフ（引き出し線付き） ===== */
      function polarToXY(cx, cy, r, angleDeg) {
        var rad = (angleDeg - 90) * Math.PI / 180;
        return { x: cx + r * Math.cos(rad), y: cy + r * Math.sin(rad) };
      }

      var PIE_COLORS = ['var(--cat-1)', 'var(--cat-2)', 'var(--cat-3)', 'var(--cat-4)', 'var(--cat-5)'];
      var OTHER_COLOR = 'var(--surface-2)';

      function colorizePie(items) {
        var colorIndex = 0;
        return items.map(function (it) {
          var isOther = it.name.indexOf('その他') === 0;
          var color = isOther ? OTHER_COLOR : PIE_COLORS[colorIndex % PIE_COLORS.length];
          if (!isOther) { colorIndex++; }
          return { name: it.name, amount: it.amount, color: color };
        });
      }

      function buildDonutSvg(items) {
        var total = items.reduce(function (s, it) { return s + it.amount; }, 0);
        var cx = 21, cy = 21, ringR = 15.9155, lineOuterR = 19.5, lineEndR = 25;
        var svg = '<circle cx="' + cx + '" cy="' + cy + '" r="' + ringR + '" fill="transparent" stroke="var(--surface-2)" stroke-width="5"></circle>';
        var labels = '';
        var cumulative = 0;
        items.forEach(function (it) {
          var pct = total > 0 ? (it.amount / total) * 100 : 0;
          var offset = 25 - cumulative;
          svg += '<circle cx="' + cx + '" cy="' + cy + '" r="' + ringR + '" fill="transparent" stroke="' + it.color + '" stroke-width="5" ' +
            'stroke-dasharray="' + pct.toFixed(2) + ' ' + (100 - pct).toFixed(2) + '" stroke-dashoffset="' + offset.toFixed(2) + '"></circle>';

          if (pct >= 3) {
            var midAngle = (cumulative + pct / 2) / 100 * 360;
            var p1 = polarToXY(cx, cy, lineOuterR, midAngle);
            var p2 = polarToXY(cx, cy, lineEndR, midAngle);
            var normalizedAngle = ((midAngle % 360) + 360) % 360;
            var textAnchor = (normalizedAngle > 5 && normalizedAngle < 175) ? 'start' : (normalizedAngle > 185 && normalizedAngle < 355) ? 'end' : 'middle';
            var dx = textAnchor === 'start' ? 1 : (textAnchor === 'end' ? -1 : 0);
            labels += '<line x1="' + p1.x.toFixed(2) + '" y1="' + p1.y.toFixed(2) + '" x2="' + p2.x.toFixed(2) + '" y2="' + p2.y.toFixed(2) + '"></line>';
            labels += '<text x="' + (p2.x + dx).toFixed(2) + '" y="' + p2.y.toFixed(2) + '" text-anchor="' + textAnchor + '" dominant-baseline="middle">' + Math.round(pct) + '%</text>';
          }
          cumulative += pct;
        });
        return svg + labels;
      }

      function renderPie(items) {
        document.getElementById('donut-svg').innerHTML = items.length > 0 ? buildDonutSvg(items) : '';
        var legend = document.getElementById('donut-legend');
        if (items.length === 0) {
          legend.innerHTML = '<p class="ranking-empty">この期間の会計データがまだありません。</p>';
          return;
        }
        legend.innerHTML = items.map(function (it) {
          return '<div class="donut-legend-row"><span class="name"><span class="dot" style="background:' + it.color + '"></span>' + it.name + '</span>' +
            '<span class="value">¥' + (it.amount || 0).toLocaleString() + '</span></div>';
        }).join('');
      }

      document.querySelectorAll('#pie-toggle button').forEach(function (btn) {
        btn.addEventListener('click', function () {
          document.querySelectorAll('#pie-toggle button').forEach(function (b) { b.classList.remove('active'); });
          btn.classList.add('active');
          currentPieView = btn.dataset.pie;
          try {
            renderPieAndTable();
          } catch (e) {
            setLoadError('load-error', '表示処理でエラーが発生しました：' + (e && e.message ? e.message : e));
          }
        });
      });

      function renderPieAndTable() {
        var isProduct = currentPieView === 'product';
        document.getElementById('pie-heading').textContent = (isProduct ? '商品別' : 'カテゴリー別') + 'TOP5';
        if (!lastData) { return; }
        renderPie(colorizePie(isProduct ? lastData.productPie : lastData.categoryPie));
        renderTable(isProduct ? lastData.productTable : lastData.categoryTable, isProduct);
      }

      function renderTable(rows, isProduct) {
        var table = document.getElementById('detail-table');
        table.innerHTML = '';
        var headCols = isProduct
          ? ['商品名', 'カテゴリ名', '単価', '販売数', '商品売上高', '構成比', '粗利']
          : ['カテゴリ名', '販売数', 'カテゴリ売上高', '構成比', '粗利'];
        var numStartIndex = isProduct ? 2 : 1;

        var thead = document.createElement('thead');
        var headRow = document.createElement('tr');
        headCols.forEach(function (h, i) {
          var th = document.createElement('th');
          th.textContent = h;
          if (i >= numStartIndex) { th.className = 'num'; }
          headRow.appendChild(th);
        });
        thead.appendChild(headRow);
        table.appendChild(thead);

        var tbody = document.createElement('tbody');
        if (rows.length === 0) {
          var emptyRow = document.createElement('tr');
          var emptyCell = document.createElement('td');
          emptyCell.colSpan = headCols.length;
          emptyCell.className = 'ranking-empty';
          emptyCell.textContent = 'この期間の会計データがまだありません。';
          emptyRow.appendChild(emptyCell);
          tbody.appendChild(emptyRow);
        } else {
          rows.forEach(function (r) {
            var tr = document.createElement('tr');
            var cells = isProduct
              ? [r.name, r.category, (r.unitPrice === null || r.unitPrice === undefined) ? '-' : '¥' + r.unitPrice.toLocaleString(),
                 r.quantity || 0, '¥' + (r.amount || 0).toLocaleString(), (r.sharePercent || 0) + '%',
                 (r.grossProfit === null || r.grossProfit === undefined) ? '-' : '¥' + r.grossProfit.toLocaleString()]
              : [r.name, r.quantity || 0, '¥' + (r.amount || 0).toLocaleString(), (r.sharePercent || 0) + '%',
                 (r.grossProfit === null || r.grossProfit === undefined) ? '-' : '¥' + r.grossProfit.toLocaleString()];
            cells.forEach(function (value, i) {
              var td = document.createElement('td');
              td.textContent = value;
              if (i >= numStartIndex) { td.className = 'num'; }
              tr.appendChild(td);
            });
            tbody.appendChild(tr);
          });
        }
        table.appendChild(tbody);
      }

      renderRefDateLabel();
      renderMonthLabel();
      renderYearLabel();
      loadAnalysis();
    </script>
  </body>
</html>
