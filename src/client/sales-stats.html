<!-- SCR-007, SCR-011 売上統計（予実比較・月次推移比較を統合） -->
<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <?!= include('client/shared/stylesheet') ?>
    <style>
      .toggle-tabs { display: inline-flex; background: var(--surface-2); border-radius: 999px; padding: 3px; margin-bottom: var(--space-md); }
      .toggle-tab { border: none; background: none; border-radius: 999px; padding: 7px 16px; font-weight: 700; font-size: 0.9em; color: var(--ink-muted); }
      .toggle-tab.active { background: var(--ai); color: #fff; }

      .period-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: var(--space-md); flex-wrap: wrap; gap: var(--space-sm); }
      .date-nav-row { display: flex; align-items: center; gap: 2px; }
      .date-display-wrap { position: relative; display: inline-flex; align-items: center; gap: 6px; font-weight: 700; font-size: 1.05em; padding: 6px 10px; border-radius: var(--radius-sm); cursor: pointer; white-space: nowrap; }
      .date-display-wrap:hover { background: var(--ai-soft); color: var(--ai); }
      .date-display-wrap input[type="month"] { position: absolute; inset: 0; color: transparent; background: transparent; border: none; cursor: pointer; }
      .date-display-wrap input[type="month"]::-webkit-calendar-picker-indicator { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }
      .year-label { font-weight: 700; font-size: 1.05em; padding: 6px 10px; }
      .period-range-note { color: var(--ink-muted); font-size: 0.85em; }

      .stats-body.loading { opacity: 0.5; pointer-events: none; transition: opacity 0.15s; }

      .top-row { display: grid; grid-template-columns: 1.4fr 1fr; gap: var(--space-md); margin-bottom: var(--space-md); }
      @media (max-width: 640px) { .top-row { grid-template-columns: 1fr; } }

      .budget-actual-labels, .budget-actual-subs { display: grid; grid-template-columns: 1fr 1fr; }
      .budget-actual-labels span, .budget-actual-subs span { font-size: 0.78em; color: var(--ink-muted); }
      .budget-actual-labels span:first-child, .budget-actual-subs span:first-child { text-align: right; padding-right: 12px; }
      .budget-actual-labels span:last-child, .budget-actual-subs span:last-child { text-align: left; padding-left: 12px; }
      .budget-actual-values { display: grid; grid-template-columns: 1fr auto 1fr; align-items: baseline; gap: var(--space-sm); margin: 2px 0; }
      .budget-actual-values .value { font-size: 1.5em; font-weight: 700; font-variant-numeric: tabular-nums; }
      .budget-actual-values .value.target { color: var(--ink-muted); text-align: right; }
      .budget-actual-values .value.actual { color: var(--ai); text-align: left; }
      .budget-actual-values .divider { color: var(--border); font-weight: 300; }

      .donut-card { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
      .donut-wrap { position: relative; width: 110px; height: 110px; margin: 0 auto; }
      .donut-wrap svg { width: 100%; height: 100%; transform: rotate(-90deg); }
      .donut-center { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; flex-direction: column; }
      .donut-caption-top { font-size: 0.72em; color: var(--ink-muted); margin-bottom: 2px; }
      .donut-pct { font-size: 1.25em; font-weight: 700; font-variant-numeric: tabular-nums; }
      .donut-pct.achieved { color: var(--good); }
      .donut-pct.behind { color: var(--warn); }
      .donut-pct.none { color: var(--ink-muted); font-size: 0.85em; }
      .pace-note { font-size: 0.72em; color: var(--ink-muted); margin-top: 4px; text-align: center; }
      .kpi-scope-note { font-size: 0.78em; color: var(--ink-muted); margin-bottom: var(--space-xs); }

      .combo-chart-wrap { position: relative; height: 200px; margin-top: var(--space-sm); }
      .combo-gridlines { position: absolute; inset: 0; }
      .combo-gridline { position: absolute; left: 0; right: 0; border-top: 1px dashed var(--border); }
      .combo-gridline-label { position: absolute; right: 0; top: -8px; font-size: 0.7em; color: var(--ink-muted); background: var(--surface); padding-left: 4px; font-variant-numeric: tabular-nums; }
      .combo-bars { position: absolute; inset: 0; display: flex; align-items: flex-end; gap: 3px; padding-right: 44px; }
      .combo-col { flex: 1; min-width: 4px; height: 100%; display: flex; align-items: flex-end; position: relative; }
      .combo-bar { width: 100%; background: var(--ai); border-radius: 3px 3px 0 0; min-height: 1px; }
      .combo-target-line { position: absolute; left: 0; right: 44px; border-top: 2px dashed var(--warn); }
      .combo-target-svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
      .combo-axis-labels { display: flex; gap: 3px; padding-right: 44px; margin-top: 4px; }
      .combo-axis-label { flex: 1; min-width: 4px; font-size: 0.65em; color: var(--ink-muted); text-align: center; white-space: nowrap; overflow: hidden; }

      .variance-chart-wrap { position: relative; height: 180px; margin-top: var(--space-sm); }
      .variance-zero-line { position: absolute; left: 0; right: 0; top: 50%; border-top: 1px solid var(--ink-muted); }
      .variance-bars { position: absolute; inset: 0; display: flex; gap: 3px; }
      .variance-col { flex: 1; min-width: 4px; position: relative; }
      .variance-bar { position: absolute; left: 0; right: 0; border-radius: 2px; min-height: 1px; }
      .variance-bar.up { background: var(--good); }
      .variance-bar.down { background: var(--bad); }
      .variance-bar-neutral { position: absolute; left: 20%; right: 20%; top: 50%; height: 2px; margin-top: -1px; background: var(--border); border-radius: 1px; }
      .variance-axis-labels { display: flex; gap: 3px; margin-top: 4px; }
      .variance-axis-label { flex: 1; min-width: 4px; font-size: 0.65em; color: var(--ink-muted); text-align: center; white-space: nowrap; overflow: hidden; }

      .table-scroll { overflow-x: auto; max-width: 100%; }
      #stats-table { font-variant-numeric: tabular-nums; }
      #stats-table th, #stats-table td { text-align: right; white-space: nowrap; }
      #stats-table th:first-child, #stats-table td:first-child { text-align: left; }
      tr.total-row td { font-weight: 700; border-top: 2px solid var(--ink); background: var(--surface-2); }
      .diff-cell.up { color: var(--good); }
      .diff-cell.down { color: var(--bad); }
      .diff-cell.na { color: var(--ink-muted); }
    </style>
  </head>
  <body data-page="<?= currentPage ?>">
    <?!= include('client/shared/icons') ?>
    <div class="app-shell">
      <?!= include('client/shared/sidebar', {baseUrl: baseUrl}) ?>
      <main class="main-content">
        <div class="toggle-tabs" id="unit-tabs">
          <button type="button" class="toggle-tab active" data-unit="day">日別</button>
          <button type="button" class="toggle-tab" data-unit="month">月別</button>
          <button type="button" class="toggle-tab" data-unit="year">年別</button>
        </div>

        <div class="period-row" id="period-row-day">
          <div class="date-nav-row">
            <button type="button" class="icon-btn" id="day-prev"><svg class="icon"><use href="#icon-chevron-left"></use></svg></button>
            <span class="date-display-wrap">
              <span id="day-period-label"></span>
              <input type="month" id="day-month-input">
            </span>
            <button type="button" class="icon-btn" id="day-next"><svg class="icon"><use href="#icon-chevron-right"></use></svg></button>
          </div>
          <div class="period-range-note" id="day-range-note"></div>

        <div class="period-row" id="period-row-month" style="display:none;">
          <div class="date-nav-row">
            <button type="button" class="icon-btn" id="month-prev"><svg class="icon"><use href="#icon-chevron-left"></use></svg></button>
            <span class="year-label" id="month-period-label"></span>
            <button type="button" class="icon-btn" id="month-next"><svg class="icon"><use href="#icon-chevron-right"></use></svg></button>

          <div class="period-range-note" id="month-range-note"></div>
        </div>

    <?!= include('client/shared/javascript') ?>
    <script>
      var currentUnit = 'day';
      var dayMonth = currentYearMonth();
      var monthYear = String(new Date().getFullYear());

      function currentYearMonth() {
        var d = new Date();
        var mm = ('0' + (d.getMonth() + 1)).slice(-2);
        return d.getFullYear() + '-' + mm;
      }
      function shiftYearMonth(value, direction) {
        var parts = value.split('-');
        var d = new Date(Number(parts[0]), Number(parts[1]) - 1 + direction, 1);
        var mm = ('0' + (d.getMonth() + 1)).slice(-2);
        return d.getFullYear() + '-' + mm;
      }

      document.getElementById('day-month-input').value = dayMonth;

      function renderPeriodRow() {
        document.getElementById('period-row-day').style.display = currentUnit === 'day' ? '' : 'none';
        document.getElementById('period-row-month').style.display = currentUnit === 'month' ? '' : 'none';
        document.getElementById('period-row-year').style.display = currentUnit === 'year' ? '' : 'none';

        if (currentUnit === 'day') {
          var parts = dayMonth.split('-');
          document.getElementById('day-period-label').textContent = parts[0] + '年' + Number(parts[1]) + '月';
          document.getElementById('day-month-input').value = dayMonth;
        } else if (currentUnit === 'month') {
          document.getElementById('month-period-label').textContent = monthYear + '年';
        }
      }

      document.getElementById('day-prev').addEventListener('click', function () { dayMonth = shiftYearMonth(dayMonth, -1); renderPeriodRow(); load(); });
      document.getElementById('day-next').addEventListener('click', function () { dayMonth = shiftYearMonth(dayMonth, 1); renderPeriodRow(); load(); });
      document.getElementById('day-month-input').addEventListener('change', function () { dayMonth = this.value; renderPeriodRow(); load(); });
      document.getElementById('month-prev').addEventListener('click', function () { monthYear = String(Number(monthYear) - 1); renderPeriodRow(); load(); });
      document.getElementById('month-next').addEventListener('click', function () { monthYear = String(Number(monthYear) + 1); renderPeriodRow(); load(); });

      document.querySelectorAll('#unit-tabs .toggle-tab').forEach(function (btn) {
        btn.addEventListener('click', function () {
          document.querySelectorAll('#unit-tabs .toggle-tab').forEach(function (b) { b.classList.remove('active'); });
          btn.classList.add('active');
          currentUnit = btn.dataset.unit;
          renderPeriodRow();
          load();
        });
      });

      function periodKeyForUnit() {
        if (currentUnit === 'month') { return monthYear; }
        if (currentUnit === 'year') { return null; }
        return dayMonth;
      }

      function setLoading(isLoading) {
        document.getElementById('stats-body').classList.toggle('loading', isLoading);
        document.querySelectorAll('#unit-tabs .toggle-tab').forEach(function (btn) { btn.disabled = isLoading; });
      }

      function load() {
        document.getElementById('load-error').textContent = '';
        setLoading(true);
        google.script.run
          .withSuccessHandler(function (data) {
            setLoading(false);
            try {
              render(data);
            } catch (e) {
              document.getElementById('load-error').textContent = '表示処理でエラーが発生しました：' + (e && e.message ? e.message : e);
            }
          })
          .withFailureHandler(function (error) {
            setLoading(false);
            document.getElementById('load-error').textContent = 'データの取得に失敗しました：' + error.message;
          })
          .getSalesStatsData(currentUnit, periodKeyForUnit());
      }

      function render(data) {
        renderRangeNote(data);
        renderKpiAndDonut(data);
        renderComboChart(data);
        renderVarianceChart(data);
        renderTable(data);
      }

      function renderRangeNote(data) {
        var items = data.items;
        var text = items[0].label + ' 〜 ' + items[items.length - 1].label;
        if (currentUnit === 'day') {
          document.getElementById('day-range-note').textContent = '集計対象：' + text;
        } else if (currentUnit === 'month') {
          document.getElementById('month-range-note').textContent = '集計対象：' + text;
        } else {
          document.getElementById('year-range-note').textContent = '集計対象：' + text;
        }
      }

      function renderKpiAndDonut(data) {
        var t = data.totals;
        document.getElementById('kpi-actual').textContent = '¥' + t.amount.toLocaleString();
        document.getElementById('kpi-actual-sub').textContent = todayCoverageNote(data);

        var budgetEl = document.getElementById('kpi-budget');
        var budgetSubEl = document.getElementById('kpi-budget-sub');
        if (t.hasBudget) {
          budgetEl.textContent = '¥' + Math.round(t.budget).toLocaleString();
        } else {
          budgetEl.textContent = '未設定';
        }
        budgetSubEl.textContent = budgetSubNote();

        var pctEl = document.getElementById('donut-pct');
        var arc = document.getElementById('donut-arc');
        if (t.hasBudget) {
          var rate = Math.round((t.amount / t.budget) * 1000) / 10;
          var achieved = rate >= 100;
          pctEl.textContent = rate + '%';
          pctEl.className = 'donut-pct ' + (achieved ? 'achieved' : 'behind');
          var fillPct = Math.min(rate, 100);
          arc.setAttribute('stroke', achieved ? 'var(--good)' : 'var(--warn)');
          arc.setAttribute('stroke-dasharray', fillPct + ' ' + (100 - fillPct));
          arc.setAttribute('stroke-dashoffset', 25);
        } else {
          pctEl.textContent = '予算未設定';
          pctEl.className = 'donut-pct none';
          arc.setAttribute('stroke', 'var(--border)');
          arc.setAttribute('stroke-dasharray', '0 100');
        }

        renderPaceNote(data, t);

        var scopeNoteEl = document.getElementById('kpi-scope-note');
        var donutCaptionEl = document.getElementById('donut-caption-top');
        if (currentUnit === 'year') {
          scopeNoteEl.textContent = '今年（' + new Date().getFullYear() + '年）の実績（下のグラフは直近10年分）';
          scopeNoteEl.style.display = '';
          donutCaptionEl.textContent = '予算達成率（今年）';
        } else {
          scopeNoteEl.style.display = 'none';
          donutCaptionEl.textContent = '予算達成率';
        }
      }

      // 期間の途中時点では達成率が低く見えがちなため、経過日数／経過月数ベースの目安を併記する
      // （例：31日中24日経過なら77%が「順調」の目安。達成率が80%でもペースは上回っている、という早合点防止）
      function renderPaceNote(data, totals) {
        var noteEl = document.getElementById('pace-note');
        if (!totals.hasBudget) {
          noteEl.style.display = 'none';
          return;
        }
        var paceRate = null;
        if (currentUnit === 'day') {
          var todayYm = formatDateForInput(new Date()).slice(0, 7);
          if (todayYm === dayMonth) {
            paceRate = Math.round((new Date().getDate() / data.items.length) * 1000) / 10;
          }
        } else if (currentUnit === 'month') {
          if (String(new Date().getFullYear()) === monthYear) {
            paceRate = Math.round(((new Date().getMonth() + 1) / 12) * 1000) / 10;
          }
        }
        if (paceRate === null) {
          noteEl.style.display = 'none';
          return;
        }
        noteEl.textContent = '経過ペース目安：' + paceRate + '%';
        noteEl.style.display = '';
      }

      function todayCoverageNote(data) {
        if (currentUnit === 'day') {
          var todayYm = formatDateForInput(new Date()).slice(0, 7);
          if (todayYm === dayMonth) {
            return data.items[0].label + '〜' + (new Date().getDate()) + '日（本日まで）';
          }
          return '';
        }
        if (currentUnit === 'month') {
          if (String(new Date().getFullYear()) === monthYear) {
            return '1〜' + (new Date().getMonth() + 1) + '月（本日まで）';
          }
          return '';
        }
        return '';
      }

      function budgetSubNote() {
        if (currentUnit === 'day') {
          return 'その月の目標を日数で割った金額';
        }
        if (currentUnit === 'month') {
          return 'その月ごとの目標の合計';
        }
        return 'その年の月目標の合計';
      }

      // 軸ラベル：日別は列が31本まで並び月日表記だと見切れるため日のみ表示する
      function axisLabelFor(item) {
        if (currentUnit === 'day') {
          return item.label.split('/')[1];
        }
        return item.label;
      }

      function renderComboChart(data) {
        var items = data.items;
        var barsWrap = document.getElementById('combo-bars');
        var axisWrap = document.getElementById('combo-axis');
        var gridWrap = document.getElementById('combo-gridlines');
        barsWrap.innerHTML = '';
        axisWrap.innerHTML = '';
        gridWrap.innerHTML = '';

        var maxAmount = items.reduce(function (m, it) { return Math.max(m, it.amount); }, 0);
        var niceMax = maxAmount > 0 ? Math.ceil(maxAmount / 4 / 1000) * 4 * 1000 : 1;
        [0, 0.5, 1].forEach(function (frac) {
          var line = document.createElement('div');
          line.className = 'combo-gridline';
          line.style.bottom = (frac * 100) + '%';
          var label = document.createElement('span');
          label.className = 'combo-gridline-label';
          label.textContent = '¥' + Math.round(niceMax * frac).toLocaleString();
          line.appendChild(label);
          gridWrap.appendChild(line);
        });

        items.forEach(function (it) {
          var col = document.createElement('div');
          col.className = 'combo-col';
          var bar = document.createElement('div');
          bar.className = 'combo-bar';
          bar.style.height = Math.max((it.amount / niceMax) * 100, it.amount > 0 ? 2 : 0) + '%';
          col.appendChild(bar);
          barsWrap.appendChild(col);
          var axisLabel = document.createElement('div');
          axisLabel.className = 'combo-axis-label';
          axisLabel.textContent = axisLabelFor(it);
          axisWrap.appendChild(axisLabel);
        });

        renderTargetLine(items, niceMax);
      }

      // 日別：目標が月内一定のため水平の点線1本。月別／年別：区間ごとに目標が異なるため、
      // 目標が設定されている点だけを滑らかな曲線でつなぐ（未設定の区間は曲線から除外する）
      function renderTargetLine(items, niceMax) {
        var lineEl = document.getElementById('combo-target-line');
        var svgEl = document.getElementById('combo-target-svg');
        svgEl.innerHTML = '';
        lineEl.style.display = 'none';

        if (currentUnit === 'day') {
          if (items[0] && items[0].hasBudget) {
            lineEl.style.display = '';
            lineEl.style.bottom = ((items[0].budget / niceMax) * 100) + '%';
          }
          return;
        }

        var wrap = svgEl.parentElement;
        var wrapRect = wrap.getBoundingClientRect();
        var cols = wrap.querySelectorAll('.combo-col');
        var points = [];
        items.forEach(function (it, i) {
          if (!it.hasBudget) { return; }
          var rect = cols[i].getBoundingClientRect();
          var x = rect.left - wrapRect.left + rect.width / 2;
          var y = wrapRect.height - (it.budget / niceMax) * wrapRect.height;
          points.push([x, y]);
        });
        if (points.length < 2) { return; }

        svgEl.setAttribute('viewBox', '0 0 ' + wrapRect.width + ' ' + wrapRect.height);
        var d = 'M ' + points[0][0] + ' ' + points[0][1];
        for (var i = 0; i < points.length - 1; i++) {
          var p0 = points[i === 0 ? i : i - 1];
          var p1 = points[i];
          var p2 = points[i + 1];
          var p3 = points[i + 2 < points.length ? i + 2 : i + 1];
          var c1x = p1[0] + (p2[0] - p0[0]) / 6;
          var c1y = p1[1] + (p2[1] - p0[1]) / 6;
          var c2x = p2[0] - (p3[0] - p1[0]) / 6;
          var c2y = p2[1] - (p3[1] - p1[1]) / 6;
          d += ' C ' + c1x + ' ' + c1y + ', ' + c2x + ' ' + c2y + ', ' + p2[0] + ' ' + p2[1];
        }
        var path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        path.setAttribute('d', d);
        path.setAttribute('fill', 'none');
        path.setAttribute('stroke', 'var(--warn)');
        path.setAttribute('stroke-width', '2');
        path.setAttribute('stroke-dasharray', '5 4');
        path.setAttribute('stroke-linecap', 'round');
        svgEl.appendChild(path);
      }

      // 予算比：実績がない（休業日・未到来）か予算が未設定の項目はニュートラルな印にする
      function renderVarianceChart(data) {
        var items = data.items;
        var barsWrap = document.getElementById('variance-bars');
        var axisWrap = document.getElementById('variance-axis');
        barsWrap.innerHTML = '';
        axisWrap.innerHTML = '';

        var maxAbs = items.reduce(function (m, it) {
          if (!it.hasBudget || it.amount === 0) { return m; }
          return Math.max(m, Math.abs(it.amount - it.budget));
        }, 1);

        items.forEach(function (it) {
          var col = document.createElement('div');
          col.className = 'variance-col';
          if (!it.hasBudget || it.amount === 0) {
            var neutral = document.createElement('div');
            neutral.className = 'variance-bar-neutral';
            col.appendChild(neutral);
          } else {
            var diff = it.amount - it.budget;
            var pct = (Math.abs(diff) / maxAbs) * 48;
            var bar = document.createElement('div');
            if (diff >= 0) {
              bar.className = 'variance-bar up';
              bar.style.bottom = '50%';
              bar.style.height = pct + '%';
            } else {
              bar.className = 'variance-bar down';
              bar.style.top = '50%';
              bar.style.height = pct + '%';
            }
            col.appendChild(bar);
          }
          barsWrap.appendChild(col);
          var label = document.createElement('div');
          label.className = 'variance-axis-label';
          label.textContent = axisLabelFor(it);
          axisWrap.appendChild(label);
        });
      }

      function diffCellHtml(actual, budget, hasBudget, hasData) {
        if (!hasBudget || !hasData) {
          return '<td class="diff-cell na">-</td>';
        }
        var diff = actual - budget;
        return '<td class="diff-cell ' + (diff >= 0 ? 'up' : 'down') + '">' + (diff >= 0 ? '+' : '−') + Math.abs(Math.round(diff)).toLocaleString() + '</td>';
      }

      function renderTable(data) {
        document.getElementById('th-period').textContent = currentUnit === 'day' ? '日付' : (currentUnit === 'month' ? '月' : '年');

        var tbody = document.getElementById('stats-table-body');
        tbody.innerHTML = '';
        data.items.forEach(function (it) {
          var tr = document.createElement('tr');
          tr.innerHTML =
            '<td>' + it.label + '</td>' +
            '<td>' + it.amount.toLocaleString() + '</td>' +
            '<td>' + it.tax.toLocaleString() + '</td>' +
            '<td>' + it.count + '組</td>' +
            '<td>' + it.avgAmount.toLocaleString() + '</td>' +
            '<td>' + it.foodAmount.toLocaleString() + '</td>' +
            '<td>' + it.drinkAmount.toLocaleString() + '</td>' +
            '<td>' + (it.hasBudget ? Math.round(it.budget).toLocaleString() : '-') + '</td>' +
            diffCellHtml(it.amount, it.budget, it.hasBudget, it.count > 0);
          tbody.appendChild(tr);
        });

        var t = data.totals;
        document.getElementById('stats-table-total').innerHTML =
          '<td>合計</td>' +
          '<td>' + t.amount.toLocaleString() + '</td>' +
          '<td>' + t.tax.toLocaleString() + '</td>' +
          '<td>' + t.count + '組</td>' +
          '<td>' + t.avgAmount.toLocaleString() + '</td>' +
          '<td>' + t.foodAmount.toLocaleString() + '</td>' +
          '<td>' + t.drinkAmount.toLocaleString() + '</td>' +
          '<td>' + (t.hasBudget ? Math.round(t.budget).toLocaleString() : '-') + '</td>' +
          diffCellHtml(t.amount, t.budget, t.hasBudget, t.count > 0);
      }

      renderPeriodRow();
      load();
    </script>
  </body>
</html>
