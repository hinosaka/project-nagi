<script>
  // 単色SVGアイコン（shared/icons.htmlのスプライトを参照）のHTML文字列を返す
  function iconSvg(name) {
    return '<svg class="icon"><use href="#icon-' + name + '"></use></svg>';
  }

  // ユーザー入力（商品名・カテゴリー名・顧客名・メモ等）をinnerHTML/属性値に埋め込む前に
  // 必ず通す。テキストノード・属性値（ダブルクォート）どちらの文脈でも安全に使える
  function escapeHtml(value) {
    return String(value == null ? '' : value)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  (function () {
    var currentPage = document.body.dataset.page;
    document.querySelectorAll('.sidebar .nav-item').forEach(function (item) {
      if (item.dataset.page === currentPage) {
        item.classList.add('active');
      }
    });
  })();

  // ハンバーガーボタン（狭幅画面）でナビの開閉
  (function () {
    var hamburgerBtn = document.getElementById('hamburger-btn');
    var navItems = document.getElementById('nav-items');
    if (hamburgerBtn && navItems) {
      hamburgerBtn.addEventListener('click', function () {
        navItems.classList.toggle('open');
      });
    }
  })();

  // 補足説明ポップオーバー（.info-btnクリックで隣接する.popoverを開閉。外側クリックで閉じる）
  document.addEventListener('click', function (event) {
    var infoBtn = event.target.closest ? event.target.closest('.info-btn') : null;
    if (infoBtn) {
      var popover = infoBtn.parentElement.querySelector('.popover');
      var wasOpen = popover.classList.contains('open');
      document.querySelectorAll('.popover.open').forEach(function (p) { p.classList.remove('open'); });
      if (!wasOpen) {
        popover.classList.add('open');
      }
      return;
    }
    if (!event.target.closest('.popover')) {
      document.querySelectorAll('.popover.open').forEach(function (p) { p.classList.remove('open'); });
    }
  });

  // 年×12マス月選択ポップオーバー（.month-picker-wrap構造のボタン群を組み立てる）。
  // config: { btnId, popoverId, yearLabelId, gridId, yearPrevId, yearNextId,
  //           getCurrentMonth: () => "yyyy-MM", onSelect: (yyyyMM) => void }
  // 戻り値のrefreshLabel()はボタン表示（例："2026年7月"）を現在の月に合わせて更新する
  function createMonthPicker(config) {
    var btn = document.getElementById(config.btnId);
    var popover = document.getElementById(config.popoverId);
    var yearLabel = document.getElementById(config.yearLabelId);
    var grid = document.getElementById(config.gridId);
    var pickerYear = null;

    function render() {
      yearLabel.textContent = pickerYear + '年';
      grid.innerHTML = '';
      var current = config.getCurrentMonth();
      for (var m = 1; m <= 12; m++) {
        var mm = ('0' + m).slice(-2);
        var value = pickerYear + '-' + mm;
        var cell = document.createElement('button');
        cell.type = 'button';
        cell.textContent = m + '月';
        if (value === current) { cell.className = 'current'; }
        cell.dataset.value = value;
        cell.addEventListener('click', function () {
          var newMonth = this.dataset.value;
          close();
          config.onSelect(newMonth);
        });
        grid.appendChild(cell);
      }
    }
    function open() {
      pickerYear = Number(config.getCurrentMonth().split('-')[0]);
      render();
      popover.classList.add('open');
    }
    function close() {
      popover.classList.remove('open');
    }
    function refreshLabel() {
      var parts = config.getCurrentMonth().split('-');
      btn.textContent = parts[0] + '年' + Number(parts[1]) + '月';
    }

    btn.addEventListener('click', function (event) {
      event.stopPropagation();
      if (popover.classList.contains('open')) { close(); } else { open(); }
    });
    document.getElementById(config.yearPrevId).addEventListener('click', function () { pickerYear--; render(); });
    document.getElementById(config.yearNextId).addEventListener('click', function () { pickerYear++; render(); });
    document.addEventListener('click', function (event) {
      if (!btn.closest('.month-picker-wrap').contains(event.target)) { close(); }
    });

    return { refreshLabel: refreshLabel, close: close };
  }

  // 画面上部のエラーバナー（アイコン＋背景色）の表示・非表示。elementIdは.load-errorクラスを持つ要素のid。
  // messageが空ならバナーを隠す。onRetryを渡すと「再読み込み」ボタンを併せて表示する
  function setLoadError(elementId, message, onRetry) {
    var el = document.getElementById(elementId);
    el.classList.toggle('show', !!message);
    el.innerHTML = '';
    if (!message) { return; }
    el.insertAdjacentHTML('afterbegin', iconSvg('alert-triangle'));
    var span = document.createElement('span');
    span.className = 'load-error-text';
    span.textContent = message;
    el.appendChild(span);
    if (onRetry) {
      var retryBtn = document.createElement('button');
      retryBtn.type = 'button';
      retryBtn.className = 'load-error-retry';
      retryBtn.title = '再読み込み';
      retryBtn.innerHTML = iconSvg('refresh-cw');
      retryBtn.addEventListener('click', onRetry);
      el.appendChild(retryBtn);
    }
  }

  function formatDateForInput(d) {
    var mm = ('0' + (d.getMonth() + 1)).slice(-2);
    var dd = ('0' + d.getDate()).slice(-2);
    return d.getFullYear() + '-' + mm + '-' + dd;
  }

  // ドーナツグラフの各セグメント（<circle>のstroke-dasharray/dashoffset）を組み立てる共通処理。
  // ダッシュボード（ラベルなし）・商品統計（引き出し線％表示あり）で、セグメントの角度計算
  // 自体は同じ数式のため共通化した（ラベル描画の有無・stroke-widthは呼び出し側の見た目に委ねる）。
  // items: [{name, amount, color}]。戻り値のsegments[i].midAngleは、そのセグメントの中央の角度
  // （0度=12時位置、時計回り）で、引き出し線などラベル描画が必要な場合に使う
  function buildDonutSegments(items, strokeWidth) {
    var cx = 21, cy = 21, r = 15.9155;
    var total = items.reduce(function (s, it) { return s + it.amount; }, 0);
    var track = '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="transparent" stroke="var(--surface-2)" stroke-width="' + strokeWidth + '"></circle>';

    var cumulative = 0;
    var segments = items.map(function (it) {
      var pct = total > 0 ? (it.amount / total) * 100 : 0;
      var offset = 25 - cumulative;
      var circle = '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="transparent" stroke="' + it.color + '" stroke-width="' + strokeWidth + '" ' +
        'stroke-dasharray="' + pct.toFixed(2) + ' ' + (100 - pct).toFixed(2) + '" stroke-dashoffset="' + offset.toFixed(2) + '"></circle>';
      var midAngle = (cumulative + pct / 2) / 100 * 360;
      cumulative += pct;
      return { circle: circle, pct: pct, midAngle: midAngle };
    });

    return { cx: cx, cy: cy, track: track, segments: segments };
  }

  // 日付表示欄の見出し用（例：2026年07月31日(金)）。dateStrは"yyyy-MM-dd"形式。
  // new Date("yyyy-MM-dd")はUTC0時として解釈されるため、getUTC系で取り出してローカルの日付ズレを防ぐ
  function formatFullDateWithWeekday(dateStr) {
    var d = new Date(dateStr);
    var days = ['日', '月', '火', '水', '木', '金', '土'];
    var mm = ('0' + (d.getUTCMonth() + 1)).slice(-2);
    var dd = ('0' + d.getUTCDate()).slice(-2);
    return d.getUTCFullYear() + '年' + mm + '月' + dd + '日(' + days[d.getUTCDay()] + ')';
  }
</script>
