<script>
  // 単色SVGアイコン（shared/icons.htmlのスプライトを参照）のHTML文字列を返す
  function iconSvg(name) {
    return '<svg class="icon"><use href="#icon-' + name + '"></use></svg>';
  }

  (function () {
    var currentPage = document.body.dataset.page;
    document.querySelectorAll('.sidebar .nav-item').forEach(function (item) {
      if (item.dataset.page === currentPage) {
        item.classList.add('active');
      }
    });
  })();

  // ハンバーガーボタン（狭幅画面）でナビの開閉
  (function () {
    var hamburgerBtn = document.getElementById('hamburger-btn');
    var navItems = document.getElementById('nav-items');
    if (hamburgerBtn && navItems) {
      hamburgerBtn.addEventListener('click', function () {
        navItems.classList.toggle('open');
      });
    }
  })();

  // 補足説明ポップオーバー（.info-btnクリックで隣接する.popoverを開閉。外側クリックで閉じる）
  document.addEventListener('click', function (event) {
    var infoBtn = event.target.closest ? event.target.closest('.info-btn') : null;
    if (infoBtn) {
      var popover = infoBtn.parentElement.querySelector('.popover');
      var wasOpen = popover.classList.contains('open');
      document.querySelectorAll('.popover.open').forEach(function (p) { p.classList.remove('open'); });
      if (!wasOpen) {
        popover.classList.add('open');
      }
      return;
    }
    if (!event.target.closest('.popover')) {
      document.querySelectorAll('.popover.open').forEach(function (p) { p.classList.remove('open'); });
    }
  });

  function formatDateForInput(d) {
    var mm = ('0' + (d.getMonth() + 1)).slice(-2);
    var dd = ('0' + d.getDate()).slice(-2);
    return d.getFullYear() + '-' + mm + '-' + dd;
  }

  // 日付表示欄の見出し用（例：2026年07月31日(金)）。dateStrは"yyyy-MM-dd"形式。
  // new Date("yyyy-MM-dd")はUTC0時として解釈されるため、getUTC系で取り出してローカルの日付ズレを防ぐ
  function formatFullDateWithWeekday(dateStr) {
    var d = new Date(dateStr);
    var days = ['日', '月', '火', '水', '木', '金', '土'];
    var mm = ('0' + (d.getUTCMonth() + 1)).slice(-2);
    var dd = ('0' + d.getUTCDate()).slice(-2);
    return d.getUTCFullYear() + '年' + mm + '月' + dd + '日(' + days[d.getUTCDay()] + ')';
  }

  // 日次／週次／月次の期間切り替えUI（タブ・前後ボタン・基準日入力）を束ねる共通コントローラー。
  // ダッシュボード・各種分析画面（期間切り替えを持つSCR-006/008/009/010）で共用する
  function createPeriodController(config) {
    var state = { period: config.initialPeriod || 'day' };

    function renderTabs() {
      config.tabsEl.innerHTML = '';
      Object.keys(config.periodLabels).forEach(function (key) {
        var tab = document.createElement('button');
        tab.type = 'button';
        tab.className = 'tab' + (key === state.period ? ' active' : '');
        tab.textContent = config.periodLabels[key];
        tab.addEventListener('click', function () {
          state.period = key;
          renderTabs();
          config.onChange(state.period, config.dateEl.value);
        });
        config.tabsEl.appendChild(tab);
      });
    }

    function shift(direction) {
      var current = new Date(config.dateEl.value);
      if (state.period === 'day') {
        current.setDate(current.getDate() + direction);
      } else if (state.period === 'week') {
        current.setDate(current.getDate() + direction * 7);
      } else {
        current.setMonth(current.getMonth() + direction);
      }
      config.dateEl.value = formatDateForInput(current);
      config.onChange(state.period, config.dateEl.value);
    }

    config.prevBtn.addEventListener('click', function () { shift(-1); });
    config.nextBtn.addEventListener('click', function () { shift(1); });
    config.dateEl.addEventListener('change', function () {
      config.onChange(state.period, config.dateEl.value);
    });

    renderTabs();
    config.dateEl.value = config.initialDate || formatDateForInput(new Date());

    return {
      getPeriod: function () { return state.period; },
      getDate: function () { return config.dateEl.value; }
    };
  }
</script>
