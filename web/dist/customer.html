    <style>
      .modal-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(35, 38, 43, 0.4);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .modal-box {
        background: var(--surface);
        border-radius: var(--radius-md);
        padding: var(--space-md) var(--space-lg);
        max-width: 380px;
        width: 90%;
        max-height: 85vh;
        overflow-y: auto;
        position: relative;
      }
      .modal-close {
        position: absolute;
        top: var(--space-sm);
        right: var(--space-sm);
      }
      .detail-header {
        display: flex;
        align-items: center;
        gap: var(--space-sm);
        margin-bottom: 2px;
        padding-right: 1.6em;
      }
      .detail-person-icon {
        width: 1.6em;
        height: 1.6em;
        color: var(--ai);
        flex-shrink: 0;
      }
      #detail-name {
        flex: 1;
        min-width: 0;
        font-size: 1.3em;
        font-weight: 700;
        border: none;
        background: transparent;
        padding: 2px;
        color: var(--ink);
      }
      #detail-name:focus {
        outline: none;
        border-bottom: 1px solid var(--ai);
      }
      .detail-visit-info {
        margin: 0 0 var(--space-md);
      }
      .visit-badge {
        display: inline-block;
        padding: 2px 10px;
        border-radius: 999px;
        font-size: 0.85em;
        margin-right: 6px;
      }
      .visit-count {
        background: var(--ai-soft);
        color: var(--ai);
      }
      .visit-last {
        background: var(--good-soft);
        color: var(--good);
      }
      .detail-phone-row {
        display: flex;
        align-items: center;
        gap: var(--space-sm);
        margin-bottom: var(--space-sm);
      }
      .detail-field-icon {
        color: var(--ink-muted);
        display: inline-flex;
      }
      #detail-phone {
        flex: 1;
        border: none;
        background: transparent;
        padding: 4px 2px;
      }
      #detail-phone:focus {
        outline: none;
        border-bottom: 1px solid var(--ai);
      }
      .memo-row {
        display: flex;
        gap: var(--space-sm);
        align-items: flex-start;
      }
      .memo-row textarea {
        flex: 1;
        min-height: 60px;
        border: none;
        background: transparent;
        padding: 4px 2px;
      }
      .memo-row textarea:focus {
        outline: none;
        border-bottom: 1px solid var(--ai);
      }
      .customer-name-link {
        color: var(--ink);
        font-weight: 700;
        cursor: pointer;
      }
      .th-with-info {
        display: flex;
        align-items: center;
        gap: 4px;
      }
      .register-row {
        display: flex;
        align-items: flex-end;
        gap: var(--space-sm);
      }
      .register-row .form-row {
        margin-bottom: 0;
      }
      #customer-table tbody tr:nth-child(even) {
        background: none;
      }

      /* ===== 注文履歴ランキング（ダッシュボードの商品別売上ランキングと同じ配色・表示方式） ===== */
      .rank-badge { display: inline-flex; align-items: center; justify-content: center; width: 22px; height: 22px; border-radius: 50%; background: var(--surface-2); color: var(--ink-muted); font-size: 0.8em; font-weight: 700; flex-shrink: 0; }
      .rank-badge.top3 { background: var(--warn-soft); color: var(--warn); }
      .ranking-row { display: flex; align-items: center; gap: var(--space-sm); padding: 7px 0; border-bottom: 1px solid var(--border); }
      .ranking-row .name { flex: 1; }
      .ranking-row .qty { font-variant-numeric: tabular-nums; color: var(--ink-muted); font-size: 0.9em; }
    </style>

    <script src="app.js"></script>
    <script>
      var currentCustomers = {};

      function loadCustomerList() {
        document.getElementById('list-error').textContent = '';
        google.script.run
          .withSuccessHandler(renderCustomerList)
          .withFailureHandler(function (error) {
            document.getElementById('list-error').textContent = '一覧の取得に失敗しました：' + error.message;
          })
          .getCustomerList();
      }

      function renderCustomerList(customerList) {
        currentCustomers = {};
        var tbody = document.querySelector('#customer-table tbody');
        tbody.innerHTML = '';
        customerList.forEach(function (customer) {
          currentCustomers[customer.CustomerId] = customer;

          var tr = document.createElement('tr');

          var nameTd = document.createElement('td');
          var nameLink = document.createElement('span');
          nameLink.className = 'customer-name-link';
          nameLink.textContent = customer.CustomerName;
          nameLink.addEventListener('click', function () {
            openDetail(customer.CustomerId);
          });
          nameTd.appendChild(nameLink);
          tr.appendChild(nameTd);

          tr.appendChild(cell(customer.VisitCount));
          tr.appendChild(cell(customer.LastVisitDate));
          tr.appendChild(cell(customer.FirstVisitDate));

          tbody.appendChild(tr);
        });
      }

      function cell(value) {
        var td = document.createElement('td');
        td.textContent = value;
        return td;
      }

      function openDetail(customerId) {
        var customer = currentCustomers[customerId];
        document.getElementById('detail-name').value = customer.CustomerName;

        document.getElementById('detail-visit-count').textContent = (customer.VisitCount || 0) + '回目来店';
        document.getElementById('detail-last-visit').textContent = customer.LastVisitDate ? ('前回 ' + customer.LastVisitDate) : '来店履歴なし';

        document.getElementById('detail-phone').value = customer.PhoneNumber || '';
        document.getElementById('detail-memo').value = customer.Memo || '';
        document.getElementById('detail-error').textContent = '';
        document.getElementById('detail-modal').dataset.customerId = customerId;
        document.getElementById('detail-modal').style.display = '';

        renderRanking('detail-top-ranking', [], 1);
        renderRanking('detail-other-ranking', [], 4);
        google.script.run
          .withSuccessHandler(function (result) {
            renderRanking('detail-top-ranking', result.top, 1);
            renderRanking('detail-other-ranking', result.others, result.top.length + 1);
          })
          .getCustomerOrderRanking(customerId);
      }

      function renderRanking(listId, items, startRank) {
        var container = document.getElementById(listId);
        container.innerHTML = '';
        if (items.length === 0) {
          var empty = document.createElement('p');
          empty.className = 'ranking-empty';
          empty.textContent = '該当する注文はまだありません。';
          container.appendChild(empty);
          return;
        }
        items.forEach(function (item, i) {
          var rank = startRank + i;
          var row = document.createElement('div');
          row.className = 'ranking-row';
          var badge = document.createElement('span');
          badge.className = 'rank-badge' + (rank <= 3 ? ' top3' : '');
          badge.textContent = rank;
          var name = document.createElement('span');
          name.className = 'name';
          name.textContent = item.MenuName;
          var qty = document.createElement('span');
          qty.className = 'qty';
          qty.textContent = item.Quantity + '点';
          row.appendChild(badge);
          row.appendChild(name);
          row.appendChild(qty);
          container.appendChild(row);
        });
      }

      function closeDetailModal() {
        document.getElementById('detail-modal').style.display = 'none';
        loadCustomerList();
      }

      document.getElementById('detail-close').addEventListener('click', closeDetailModal);

      document.getElementById('detail-modal').addEventListener('click', function (event) {
        if (event.target === this) {
          closeDetailModal();
        }
      });

      // ニックネーム・電話番号・メモは編集ボタン・保存ボタンを介さず、フォーカスを外した時点で自動保存する
      function saveDetailFields() {
        var customerId = document.getElementById('detail-modal').dataset.customerId;
        var customer = currentCustomers[customerId];
        if (!customer) {
          return;
        }

        var newName = document.getElementById('detail-name').value.trim();
        var newPhone = document.getElementById('detail-phone').value;
        var newMemo = document.getElementById('detail-memo').value;
        if (newName === customer.CustomerName && newPhone === (customer.PhoneNumber || '') && newMemo === (customer.Memo || '')) {
          return;
        }

        document.getElementById('detail-error').textContent = '';
        google.script.run
          .withSuccessHandler(function () {
            customer.CustomerName = newName;
            customer.PhoneNumber = newPhone;
            customer.Memo = newMemo;
          })
          .withFailureHandler(function (error) {
            document.getElementById('detail-error').textContent = error.message;
            document.getElementById('detail-name').value = customer.CustomerName;
            document.getElementById('detail-phone').value = customer.PhoneNumber || '';
            document.getElementById('detail-memo').value = customer.Memo || '';
          })
          .saveCustomerDetail({
            CustomerId: customerId,
            CustomerName: newName,
            PhoneNumber: newPhone,
            Memo: newMemo
          });
      }

      document.getElementById('detail-name').addEventListener('blur', saveDetailFields);
      document.getElementById('detail-phone').addEventListener('blur', saveDetailFields);
      document.getElementById('detail-memo').addEventListener('blur', saveDetailFields);

      document.getElementById('register-form').addEventListener('submit', function (event) {
        event.preventDefault();
        document.getElementById('form-error').textContent = '';

        var customerName = document.getElementById('CustomerName').value;

        google.script.run
          .withSuccessHandler(function () {
            document.getElementById('register-form').reset();
            loadCustomerList();
          })
          .withFailureHandler(function (error) {
            document.getElementById('form-error').textContent = error.message;
          })
          .registerCustomer(customerName);
      });

      loadCustomerList();
    </script>
  </body>
</html>
